// ==================== BOOKING IMPORT ====================
function BookingImport({onReplace,existingData,type='xlsx',importMode='append'}){
  const [conflict,setConflict]=useState([]);
  const [pending,setPending]=useState([]);
  const [showConflict,setShowConflict]=useState(false);
  const [ok,setOk]=useState(false);
  const [nameErrors,setNameErrors]=useState([]);
  const [showNameErrors,setShowNameErrors]=useState(false);

  const parseCSV=(file)=>{
    const reader=new FileReader();
    reader.onload=evt=>{
      const text=evt.target.result;
      const lines=splitCSVLines(text).filter(l=>l.trim());
      if(lines.length<2){setOk(false);return;}
      const hdr=parseCSVLine(lines[0]).map(h=>h.trim().replace(/^\uFEFF/,''));
      const rows=lines.slice(1).map(line=>{
        const vals=parseCSVLine(line);
        const o=normalizeImportRow({});hdr.forEach((h,i)=>{o[h]=vals[i]||'';});
        return o;
      });
      const entries=rows.map(row=>{
        const weekRaw=row['week']||row['week (Ends on Friday)']||'';
        let weekDate='';
        try{
          const d=parseWeekString(weekRaw);
          weekDate=d?getFridayOfWeek(d).format('YYYY-MM-DD'):String(weekRaw||'');
        }catch(e){weekDate=String(weekRaw||'');}
        return {
          engagementCode:String(row['Engagement code']||'').trim(),
          engagementName:String(row['Engagement name']||'').trim(),
          name:String(row['Name']||'').trim(),
          level:String(row['Level']||'').trim(),
          week:weekDate,hrs:importNumber(row['Booking hrs']??0),
          eic:String(row['EIC']||'').trim(),
          rawWeek:weekRaw,
        };
      }).filter(e=>e.name&&e.engagementCode&&e.week);
      processEntries(entries);
    };
    reader.readAsText(file);
  };

  const parseExcel=(file)=>{
    const reader=new FileReader();
    reader.onload=evt=>{
      const data=new Uint8Array(evt.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''}).map(normalizeImportRow);
      const entries=rows.map(row=>{
        let weekVal=row['week']||row['week (Ends on Friday)'];
        let weekDate='';
        try{
          let d=null;
          if(weekVal instanceof Date&&!isNaN(weekVal.getTime())){
            const y=weekVal.getFullYear(),m=weekVal.getMonth(),day=weekVal.getDate();
            d=dayjs(`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`);
          }else{
            d=parseWeekString(weekVal);
          }
          weekDate=d?getFridayOfWeek(d).format('YYYY-MM-DD'):String(weekVal||'');
        }catch(e){weekDate=String(weekVal||'');}
        return {
          engagementCode:String(row['Engagement code']||'').trim(),
          engagementName:String(row['Engagement name']||'').trim(),
          name:String(row['Name']||'').trim(),
          level:String(row['Level']||'').trim(),
          week:weekDate,hrs:importNumber(row['Booking hrs']??0),
          eic:String(row['EIC']||'').trim(),
          rawWeek:weekVal,
        };
      }).filter(e=>e.name&&e.engagementCode&&e.week);
      processEntries(entries);
    };
    reader.readAsArrayBuffer(file);
  };

  const processEntries=(entries)=>{
    entries=preparePendingBookings(entries.map(e=>({...e,name:normalizeName(e.name),eic:normalizeName(e.eic)})));
    const invalid=[];
    entries.forEach((e,i)=>{
      if(!BookingStaff.isBookingName(e.name))invalid.push({row:i+2,field:'Name',value:e.name,msg:'正式姓名须以点号分隔；待入职人员可使用中文名'});
      else e.name=normalizeName(e.name);
      if(!BookingStaff.isBookingName(e.eic))invalid.push({row:i+2,field:'EIC',value:e.eic,msg:'姓名为空或包含无法识别的字符；支持点号、空格和连续英文姓名'});
      else e.eic=normalizeName(e.eic);
      const nl=normalizeLevel(e.level);
      if(!nl)invalid.push({row:i+2,field:'Level',value:e.level,msg:'只能填 Senior、Staff、Manager、Intern'});
      else e.level=nl;
      if(!Number.isFinite(e.hrs)||e.hrs<0)invalid.push({row:i+2,field:'Booking hrs',value:e.hrs,msg:'请填写非负数字工时'});
      if(!isValidWeekRaw(e.rawWeek))invalid.push({row:i+2,field:'Week',value:String(e.rawWeek||''),msg:'日期无法识别、日期不存在或超出当前年份前后5年范围；支持年月日文本和 Excel 日期序号'});
    });
    if(invalid.length>0){setNameErrors(invalid);setShowNameErrors(true);return;}

    if(isOu){const eics=new Set(entries.map(e=>e.eic));const rest=existingData.filter(ee=>!eics.has(ee.eic));onReplace([...rest,...entries]);setOk(true);setTimeout(()=>setOk(false),2000);return;}
    if(importMode==='replace'){onReplace(entries);setOk(true);setTimeout(()=>setOk(false),2000);return;}
    const conflicts=existingData.filter(ee=>entries.some(ne=>ne.name===ee.name&&ne.week===ee.week&&ne.eic===ee.eic));
    if(conflicts.length>0){setPending(entries);setConflict(conflicts);setShowConflict(true);}
    else{const merged=[...existingData,...entries];onReplace(merged);setOk(true);setTimeout(()=>setOk(false),2000);}
  };

  const handleFile=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();if(ext==='csv')parseCSV(f);else parseExcel(f);};
  const handleOverride=()=>{
    const rest=existingData.filter(ee=>!pending.some(ne=>ne.name===ee.name&&ne.week===ee.week&&ne.eic===ee.eic));
    const merged=[...rest,...pending];onReplace(merged);setShowConflict(false);setOk(true);setTimeout(()=>setOk(false),2000);
  };
  const handleAppend=()=>{
    const merged=[...existingData,...pending];onReplace(merged);setShowConflict(false);setOk(true);setTimeout(()=>setOk(false),2000);
  };
  const isOu=type==='csv';
  const overwriteText=importMode==='replace'?'替换全部已有排班数据，以本次导入为准':'补充新排班，如遇同一人同一周已有数据将弹窗选择覆盖或补充';
  const ouOverwriteText='每次导入覆盖该 EIC 的全部数据，以本次上传为准';

  return (
    <div className="import-page">
      <div className="import-card glass-card">
        <h3>{isOu?'上传 EIC 管理数据':'上传 Booking Template'}</h3>
        <div className="import-section">
          <div className="import-section-label">文件格式</div>
          <div className="import-section-content">支持 <code>.xlsx</code> <code>.csv</code> 格式{isOu?'（从 EIC 管理模块导出的文件）':''}</div>
        </div>
        <div className="import-section">
          <div className="import-section-label">字段说明</div>
          <div className="import-section-content"><code>Engagement code</code> <code>Engagement name</code> <code>Name</code> <code>Level</code> <code>{isOu?'week':'week (Ends on Friday)'}</code> <code>Booking hrs</code> <code>EIC</code></div>
        </div>
        <div className="import-section">
          <div className="import-section-label">数据覆盖逻辑</div>
          <div className="import-section-content">{isOu?ouOverwriteText:overwriteText}</div>
        </div>
        <label className="upload-area">
          <input type="file" accept='.csv,.xlsx,.xls' onChange={handleFile} className="file-input"/>
          <div className="upload-icon"><UIIcon name="folder"/></div>

        </label>
        {!isOu&&<button className="glass-btn" onClick={downloadBookingTemplate} style={{marginTop:16}}><UIIcon name="download"/> 下载 Template</button>}
        {ok&&<div className="success-msg">✓ 导入成功！</div>}
      </div>

function CompanyBookingImport({onReplace, existingData, importMode='append'}){
  const [ok,setOk]=useState(false);
  const [pending,setPending]=useState([]);
  const [conflict,setConflict]=useState([]);
  const [showConflict,setShowConflict]=useState(false);
  const [unmatched,setUnmatched]=useState([]);
  const [showUnmatched,setShowUnmatched]=useState(false);
  const [manualMap,setManualMap]=useState({});
  const [rawSG,setRawSG]=useState(null);

  const processRawSG=(json)=>{
    // Skip leading empty rows
    let start=0;
    while(start<json.length && json[start].every(c=>c==='' || c==null))start++;
    if(start>=json.length){return;}
    const header=json[start];
    const weekCols=[];
    for(let i=7;i<header.length;i++){
      const friday=parseSGWeekHeader(header[i]);
      if(friday)weekCols.push({idx:i,friday});
    }
    if(weekCols.length===0){alert('未识别到周列，请检查文件格式');return;}

    const entries=[];
    const missingEmails=new Set();
    for(let r=start+1;r<json.length;r++){
      const row=json[r];
      if(!row[2] || !row[6])continue;
      const engagementCode=String(row[2]).trim();
      const engagementName=String(row[3]).trim();
      const email=String(row[6]).trim();
      let staff=resolveBookingStaff(email);
      const manual=manualMap[email.toLowerCase()];
      if(manual)staff={...manual,name:normalizeName(manual.name),eic:normalizeName(manual.eic),email};
      if(!staff){missingEmails.add(email);continue;}

      weekCols.forEach(wc=>{
        const hrs=importNumber(row[wc.idx]||0);
        if(!Number.isFinite(hrs)||hrs<0)throw Error('第 '+(r+1)+' 行工时无效');
        if(hrs>0){
          entries.push({
            engagementCode,
            engagementName,
            name:staff.name,
            level:staff.level,
            week:wc.friday,
            hrs,
            eic:staff.eic,
            email:staff.email||'',
            pending:BookingStaff.isPendingName(staff.name),
          });
        }
      });
    }

    if(missingEmails.size>0){
      setUnmatched(Array.from(missingEmails));
      setShowUnmatched(true);
      return;
    }
    processEntries(entries);
  };

  const parseSGExcel=(file)=>{
    const reader=new FileReader();
    reader.onload=evt=>{
      const data=new Uint8Array(evt.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      setRawSG(json);
      try{processRawSG(json);}catch(error){alert('排班未导入：'+error.message);}
    };
    reader.readAsArrayBuffer(file);
  };

  const processEntries=(entries)=>{
    entries=preparePendingBookings(entries.map(e=>({...e,name:normalizeName(e.name),eic:normalizeName(e.eic)})));
    const invalid=[];
    entries.forEach((e,i)=>{
      if(!BookingStaff.isBookingName(e.name))invalid.push({row:i+2,field:'Name',value:e.name});
      else e.name=normalizeName(e.name);
      if(!BookingStaff.isBookingName(e.eic))invalid.push({row:i+2,field:'EIC',value:e.eic});
      else e.eic=normalizeName(e.eic);
    });
    if(invalid.length>0){alert('Name/EIC格式错误：'+invalid.map(x=>`${x.field}=${x.value}`).join('; '));return;}

    if(importMode==='replace'){onReplace(entries);setOk(true);setTimeout(()=>setOk(false),2000);return;}
    const conflicts=existingData.filter(ee=>entries.some(ne=>ne.name===ee.name&&ne.week===ee.week&&ne.eic===ee.eic));
    if(conflicts.length>0){setPending(entries);setConflict(conflicts);setShowConflict(true);}
    else{const merged=[...existingData,...entries];onReplace(merged);setOk(true);setTimeout(()=>setOk(false),2000);}
  };

  const handleFile=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;parseSGExcel(f);};
  const handleOverride=()=>{
    const rest=existingData.filter(ee=>!pending.some(ne=>ne.name===ee.name&&ne.week===ee.week&&ne.eic===ee.eic));
    const merged=[...rest,...pending];onReplace(merged);setShowConflict(false);setOk(true);setTimeout(()=>setOk(false),2000);
  };
  const handleAppend=()=>{
    const merged=[...existingData,...pending];onReplace(merged);setShowConflict(false);setOk(true);setTimeout(()=>setOk(false),2000);
  };

  const sgOverwriteText=importMode==='replace'?'替换全部已有排班数据，以本次导入为准':'补充新排班，如遇同一人同一周已有数据将弹窗选择覆盖或补充';

  return (
    <div className="import-page">
      <div className="import-card glass-card">
        <h3>排班小工具数据</h3>
        <div className="import-section">
          <div className="import-section-label">文件格式</div>
          <div className="import-section-content">支持 <code>.xlsx</code> <code>.xls</code> 格式，请将排班小工具排班数据贴入 Excel 文件后上传</div>
        </div>
        <div className="import-section">
          <div className="import-section-label">字段说明</div>
          <div className="import-section-content"><code>相关订单</code> <code>Code Type</code> <code>Engagement Code</code> <code>Engagement Name</code> <code>分类</code> <code>Section</code> <code>员工姓名</code> <code>动态周列…</code></div>
        </div>
        <div className="import-section">
          <div className="import-section-label">数据覆盖逻辑</div>
          <div className="import-section-content">{sgOverwriteText}</div>
        </div>
        <label className="upload-area">
          <input type="file" accept='.xlsx,.xls' onChange={handleFile} className="file-input"/>
          <div className="upload-icon"><UIIcon name="folder"/></div>
          <div className="upload-text">点击选择文件上传</div>
        </label>
        {ok&&<div className="success-msg">✓ 导入成功！</div>}
      </div>
      {showUnmatched&&(
        <div className="modal-overlay" onClick={()=>setShowUnmatched(false)}>
          <div className="modal glass-card" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
            <h3><UIIcon name="alert"/> 未匹配到人员主数据</h3>
            <p style={{color:"var(--muted)",marginBottom:8}}>以下姓名或邮箱不在后台主数据中，请补充 Name、Level、EIC；未在 masterdata 中的姓名将标记为 Pending，之后可匹配到正式人员：</p>
            <div className="conflict-list">
              {unmatched.map((email,idx)=>{
                const key=email.toLowerCase();
                const v=manualMap[key]||{name:'',level:'',eic:''};
                return (
                  <div key={idx} style={{marginBottom:12,padding:10,background:'rgba(0,0,0,0.03)',borderRadius:8}}>
                    <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>{email}</div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      <input placeholder="Name" value={v.name} onChange={e=>setManualMap(prev=>({...prev,[key]:{...v,name:e.target.value}}))} style={{flex:1,minWidth:100,padding:'6px 10px',border:'1px solid rgba(0,0,0,0.12)',borderRadius:6,fontSize:13}}/>
                      <select value={v.level} onChange={e=>setManualMap(prev=>({...prev,[key]:{...v,level:e.target.value}}))} style={{padding:'6px 10px',border:'1px solid rgba(0,0,0,0.12)',borderRadius:6,fontSize:13}}>
                        <option value="">Level</option>
                        <option>Manager</option>
                        <option>Senior</option>
                        <option>Staff</option>
                        <option>Intern</option>
                      </select>
                      <input placeholder="EIC" value={v.eic} onChange={e=>setManualMap(prev=>({...prev,[key]:{...v,eic:e.target.value}}))} style={{flex:1,minWidth:100,padding:'6px 10px',border:'1px solid rgba(0,0,0,0.12)',borderRadius:6,fontSize:13}}/>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="modal-actions">
              <button className="glass-btn" onClick={()=>setShowUnmatched(false)}>取消</button>
              <button className="glass-btn primary-btn" onClick={()=>{setShowUnmatched(false);if(rawSG){try{processRawSG(rawSG);}catch(error){alert('排班未导入：'+error.message);}}}}>确认并重新上传</button>
            </div>
          </div>
        </div>
      )}
      {showConflict&&(
        <div className="modal-overlay" onClick={()=>setShowConflict(false)}>
          <div className="modal glass-card" onClick={e=>e.stopPropagation()}>
            <h3><UIIcon name="alert"/> 发现数据冲突</h3>
            <p style={{color:"var(--muted)",marginBottom:8}}>以下人员/周已有排班数据：</p>
            <div className="conflict-list">
              {conflict.map((e,i)=><div key={i} className="conflict-item">{e.name} - {e.week} - {e.engagementCode}</div>)}
            </div>
            <p style={{fontSize:13,color:"var(--muted)"}}>请选择处理方式：</p>
            <div className="modal-actions">
              <button className="glass-btn" onClick={handleOverride}>覆盖数据</button>
              <button className="glass-btn primary-btn" onClick={handleAppend}>补充数据</button>
              <button className="glass-btn" onClick={()=>setShowConflict(false)}>取消</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function useDataModel(data,fyFilter){
  return useMemo(()=>{
    const validData=data.filter(e=>e.week && parseWeekString(e.week));
    const allDates=validData.map(e=>e.week).filter(Boolean).map(w=>dayjs(w).toDate().getTime());
    // Week choices come from the selected fiscal years even before any booking exists.
    const maxDate=allDates.length?dayjs(new Date(Math.max(...allDates))):dayjs();
    const lastFri=getFridayOfWeek(maxDate);

    const fyEnd=parseInt(getFiscalYear(lastFri).replace('FY',''),10);
    let rangeStart=getFridayOfWeek(dayjs('2026-06-05'));
    let rangeEnd=getFridayOfWeek(dayjs(`${2000+fyEnd}-06-30`));
    if(rangeEnd.isAfter(dayjs(`${2000+fyEnd}-06-30`)))rangeEnd=rangeEnd.subtract(7,'day');

    if(fyFilter&&fyFilter.size>0){
      const fys=Array.from(fyFilter).map(f=>parseInt(f.replace('FY',''),10)).sort((a,b)=>a-b);
      const firstFy=fys[0];
      const lastFy=fys[fys.length-1];
      rangeStart=getFridayOfWeek(dayjs(`${2000+firstFy-1}-07-01`));
      rangeEnd=getFridayOfWeek(dayjs(`${2000+lastFy}-06-30`));
      if(rangeEnd.isAfter(dayjs(`${2000+lastFy}-06-30`)))rangeEnd=rangeEnd.subtract(7,'day');
    }

    const weeks=[];let cur=rangeStart;
    while(cur.isBefore(rangeEnd)||cur.isSame(rangeEnd)){weeks.push(cur.format('YYYY-MM-DD'));cur=cur.add(7,'day');}
    const weekObjs=weeks.map(w=>{const d=dayjs(w);return {fridayDate:w,label:`${getFiscalYear(d)} ${formatWeekLabel(w)}`,availableHrs:getAvailableHrs(d)};});

    const personMap=new Map();const nameInfo=new Map();
    validData.forEach(e=>{if(!nameInfo.has(e.name))nameInfo.set(e.name,{level:e.level,eic:e.eic});});
    const wsSet=new Set(weeks);

    validData.forEach(e=>{
      if(!wsSet.has(e.week))return;
      if(!personMap.has(e.name))personMap.set(e.name,{name:e.name,level:nameInfo.get(e.name).level,eic:nameInfo.get(e.name).eic,weeks:{}});
      const pw=personMap.get(e.name);
      if(!pw.weeks[e.week])pw.weeks[e.week]=[];
      pw.weeks[e.week].push({code:e.engagementCode,name:e.engagementName,hrs:e.hrs});
    });

    const levelOrder=['Partner','Director','Senior Manager','Manager','Senior','Staff','Assistant','Intern',''];
    const getScore=l=>{const i=levelOrder.indexOf(l);return i>=0?i:999;};
    const result=Array.from(personMap.values());
    result.sort((a,b)=>{const s=getScore(a.level)-getScore(b.level);return s!==0?s:a.name.localeCompare(b.name);});

    result.forEach(pw=>{pw.subtotals={};pw.idles={};weekObjs.forEach(w=>{const total=(pw.weeks[w.fridayDate]||[]).reduce((s,e)=>s+e.hrs,0);pw.subtotals[w.fridayDate]=total;pw.idles[w.fridayDate]=Math.max(0,w.availableHrs-total);});});
    return {weeks:weekObjs,personWeeks:result};
  },[data,fyFilter]);
}

function BookingView({navigation,data,onUpdate,budgetData,setSub,mode,fyFilter,toggleFY,setImportMode,pendingCount,onMatchPending}){
  const {weeks,personWeeks}=useDataModel(data,fyFilter);
  const [collapsed,setCollapsed]=useState(new Set());
  const [editing,setEditing]=useState(null);
  const [showExport,setShowExport]=useState(false);
  const [showLocator,setShowLocator]=useState(false);
  const [showBatchDelete,setShowBatchDelete]=useState(false);
  const [showManualBooking,setShowManualBooking]=useState(false);
  const [showImportChoice,setShowImportChoice]=useState(false);
  const [importChoice,setImportChoice]=useState('append');
  const [locateWeek,setLocateWeek]=useState('');
  const [projectFilter,setProjectFilter]=useState('');
  const gridRef=useRef(null);


  // Entering this view locates the current week; saving cells must retain the viewport.
  useEffect(()=>{if(gridRef.current&&weeks.length>0){const t=getFridayOfWeek(dayjs()).format('YYYY-MM-DD');const i=weeks.findIndex(w=>w.fridayDate===t);if(i>=0){const th=gridRef.current.querySelector('.col-week');setTimeout(()=>{if(gridRef.current)gridRef.current.scrollLeft=Math.max(0,i*(th?th.getBoundingClientRect().width:80));},150);}}},[]);

  const scrollToWeek=(w)=>{
    const idx=weeks.findIndex(week=>week.fridayDate===w);
    const grid=gridRef.current;
    if(idx>=0&&grid){
      const weekTh=grid.querySelector('.col-week');
      const weekW=weekTh?weekTh.getBoundingClientRect().width:80;
      const target=Math.max(0,idx*weekW);
      grid.style.scrollBehavior='auto';
      grid.scrollLeft=target;
      setTimeout(()=>{
        grid.style.scrollBehavior='smooth';
      },50);
    }
    setShowLocator(false);setLocateWeek('');
  };

  useEffect(()=>{
    const root=document.documentElement;
    let dragTarget=null,startX=0,startW=0,prop='';
    const onDown=e=>{
      const handle=e.target.closest('.resize-handle');
      if(!handle)return;
      dragTarget=handle.parentElement;
      prop=dragTarget.classList.contains('col-name')?'--col-name-w':'--col-proj-w';
      startX=e.clientX;
      startW=parseFloat(getComputedStyle(root).getPropertyValue(prop))||100;
      e.preventDefault();
    };
    const onMove=e=>{
      if(!dragTarget)return;
      const delta=e.clientX-startX;
      const newW=Math.max(60,Math.min(400,startW+delta));
      root.style.setProperty(prop,newW+'px');
    };
    const onUp=()=>{dragTarget=null;};
    document.addEventListener('mousedown',onDown);
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    return ()=>{document.removeEventListener('mousedown',onDown);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};

  const allProjects=useMemo(()=>{const m=new Map();data.forEach(e=>m.set(e.engagementCode,e.engagementName));(budgetData||[]).forEach(b=>{if(b.engagementCode&&!m.has(b.engagementCode))m.set(b.engagementCode,b.engagementName);});return Array.from(m,([c,n])=>({code:c,name:n}));},[data,budgetData]);

  const togglePerson=n=>setCollapsed(prev=>{const next=new Set(prev);next.has(n)?next.delete(n):next.add(n);return next;});

  const handleEdit=(name,week,code,ename,hrs)=>{setEditing({name,week,code,ename,hrs,isNew:hrs===0});};

      {weeks.length===0?<div className="empty-state">暂无排班数据，请先导入Booking Template</div>:(
        <div className="grid-container">
          <div className="grid-scroll" ref={gridRef}>
            <table className="booking-grid" style={{"--week-count":weeks.length}}>
              <thead><tr>

              </tr></thead>
              <tbody>
                {personWeeks.map(pw=>{
                  if(projectFilter){
                    const hasProject=weeks.some(w=>getProjectWeekHrs(pw,w.fridayDate,projectFilter)>0);

                    const proj=allProjects.find(p=>p.code===projectFilter)||{code:projectFilter,name:''};
                    return (

                  const projects=[];const seen=new Set();
                  weeks.forEach(w=>{(pw.weeks[w.fridayDate]||[]).forEach(e=>{if(!seen.has(e.code)){seen.add(e.code);projects.push(e);}});});
                  const isColl=collapsed.has(pw.name);
                  const nameCell=<><span className="collapse-toggle" onClick={()=>togglePerson(pw.name)}>{isColl?'▶':'▼'}</span><StaffName name={pw.name} level={pw.level}/></>;

                  if(isColl){
                    return <tr key={pw.name} className="person-header-row">
                      <td className="col-name">{nameCell}</td>
                      <td className="col-project subtotal-cell">合计</td>

      {editing&&<EditModal code={editing.code} ename={editing.ename} hrs={editing.hrs} isNew={editing.isNew} projects={allProjects} existingNames={Array.from(new Set([...data.map(e=>e.name),...STAFF_MASTER.map(person=>person.name)]))} existingLevels={{}} existingEICs={{}} onSave={doSave} onRemove={doRemove} onClose={()=>setEditing(null)}/>}
      {showExport&&<ExportModal data={data} onClose={()=>setShowExport(false)}/>}
      {showLocator&&<WeekLocator weeks={weeks} value={locateWeek} onChange={setLocateWeek} onGo={scrollToWeek} onClose={()=>setShowLocator(false)}/>}
      {showBatchDelete&&<BatchDeleteModal data={data} onClose={()=>setShowBatchDelete(false)} onDelete={entries=>{onUpdate(entries,'批量删除排班');}}/>}
      {showManualBooking&&<ManualBookingModal data={data} allProjects={allProjects} weeks={weeks} onClose={()=>setShowManualBooking(false)} onAdd={entries=>{const keySet=new Set(entries.map(e=>`${e.name}|${e.engagementCode}|${e.week}`));const filtered=data.filter(e=>!keySet.has(`${e.name}|${e.engagementCode}|${e.week}`));onUpdate([...filtered,...entries],'手动排班');}}/>}
      {showImportChoice&&<ImportChoiceDialog choice={importChoice} onChange={setImportChoice} onSelect={source=>{setImportMode(importChoice);setShowImportChoice(false);setSub(source);}} onClose={()=>setShowImportChoice(false)}/>}

  );
}

  const scrollToWeek=(w)=>{

    const onUp=()=>{dragTarget=null;};
    document.addEventListener('mousedown',onDown);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousedown',onDown);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  },[]);

  return (

      <div className="view-header"><PageHeading title="IDLE情况" detail={Array.from(fyFilter).sort().join(' · ')} /></div>

      {weeks.length===0?<div className="empty-state">暂无排班数据</div>:(
        <div className="grid-container"><div className="grid-scroll" ref={gridRef}>
          <table className="booking-grid idle-grid" style={{"--week-count":weeks.length}}><thead><tr><th className="col-name">姓名<div className="resize-handle"></div></th><th className="col-project">IDLE<div className="resize-handle"></div></th>{weeks.map(w=><th key={w.fridayDate} id={'wk-'+w.fridayDate} className={"col-week"+(w.fridayDate===getFridayOfWeek(dayjs()).format("YYYY-MM-DD")?" is-current":"")}><div className="week-header"><span className="week-fy">{w.label.split(" ")[0]} </span>{w.label.split(" ").slice(1).join(" ")}</div><div className="week-avail">{w.availableHrs}h</div></th>)}</tr></thead>
            <tbody>
              {personWeeks.map(pw=><tr key={pw.name} className="idle-row">

// ==================== EDITABLE CELL ====================
function EditableCell({value, onChange, type='text', align='center', className=''}){
  const [editing, setEditing] = useState(false);
  const [temp, setTemp] = useState(String(value));

  useEffect(() => { setTemp(String(value)); }, [value]);

  const startEdit = () => { setEditing(true); setTemp(String(value)); };
  const commit = () => {
    if (type === 'number') {
      const n = parseFloat(temp);
      onChange(isNaN(n) ? 0 : n);
    } else {
      onChange(temp);
    }
    setEditing(false);
  };
  const onKeyDown = e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setEditing(false); };

  if (editing) {
    return (
      <td className={`editable ${className}`}>
        <input autoFocus type={type==='number'?'number':'text'} value={temp}
          onChange={e=>setTemp(e.target.value)} onBlur={commit} onKeyDown={onKeyDown}
          style={{textAlign:align}} />
      </td>
    );
  }
  const display = type==='number' ? (value==='' || value===null || value===undefined ? '—' : value) : value;
  return <td className={`editable ${className}`} onDoubleClick={startEdit}>{display}</td>;
}

function DropdownCell({value, options, onChange, className=''}){
  return (
    <td className={`editable ${className}`}>
      <select value={value} onChange={e=>onChange(e.target.value)}
        style={{width:'100%',padding:'6px 8px',border:'1px solid rgba(0,0,0,0.12)',borderRadius:6,fontSize:13,background:'rgba(255,255,255,0.7)',color:'#334155',outline:'none',cursor:'pointer'}}>
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
    </td>
  );
}

// ==================== BUDGET IMPORT ====================
function parseBudgetEntries(rows){
  return rows.map(row=>{
    const code=String(row['Engagement code']||'').trim();
    const name=String(row['Engagement Name']||'').trim();
    const hrs=importNumber(row['budget hrs']||0);
    const ser=importNumber(row['budget SER']||0);
    if(!Number.isFinite(hrs)||!Number.isFinite(ser)||hrs<0||ser<0)throw Error('项目 '+code+' 的预算须为非负数字');
    return {engagementCode:code,engagementName:name,budgetHrs:hrs,budgetSER:ser,benchmark:'hrs',remark:''};
  }).filter(e=>e.engagementCode);
}

function RateEdit({label, value, level, rates, onRatesChange}){
  const [editing, setEditing] = useState(false); const [temp, setTemp] = useState(String(value));
  useEffect(()=>{setTemp(String(value));},[value]);
  const commit = () => { const n=parseFloat(temp); onRatesChange({...rates,[level]:isNaN(n)?0:n}); setEditing(false); };
  const onKeyDown = e => { if(e.key==='Enter')commit(); if(e.key==='Escape')setEditing(false); };
  return (
    <label>{label} rate: {editing ? <input autoFocus type="number" value={temp} onChange={e=>setTemp(e.target.value)} onBlur={commit} onKeyDown={onKeyDown} style={{width:64,padding:'4px 8px',border:'1px solid #FF5701',borderRadius:6,fontSize:13,fontWeight:600,textAlign:'right'}} /> : <span className="rate-value" onDoubleClick={()=>{setEditing(true);setTemp(String(value));}}>{value}</span>}</label>
  );
}

function ProjectBudgetView({navigation,data, budgetData, rates, addBudgetRow, updateBudgetRow, deleteBudgetRow, onRatesChange, setBudgetData, timesheetData, setTimesheetData}){
  const bookingStats = useMemo(() => {
    const stats = new Map();
    data.forEach(e => {
      if (!stats.has(e.engagementCode)) { stats.set(e.engagementCode, { totalHrs: 0, levelHrs: {} }); }
      const s = stats.get(e.engagementCode);
      s.totalHrs += e.hrs;
      s.levelHrs[e.level] = (s.levelHrs[e.level] || 0) + e.hrs;
    });
    return stats;
  }, [data]);

  const actualStats = useMemo(() => {
    const stats = new Map();
    timesheetData.forEach(e => {
      const code = e.engagementCode;
      if (!stats.has(code)) { stats.set(code, { totalHrs: 0, levelHrs: {} }); }
      const s = stats.get(code);
      const hrs = Number(e.hrs) || 0;
      s.totalHrs += hrs;
      s.levelHrs[e.level] = (s.levelHrs[e.level] || 0) + hrs;
    });
    return stats;
  }, [timesheetData]);

  const computeSER = useCallback(levelHrs => {
    return (levelHrs['Manager']||0)*rates.Manager +
           (levelHrs['Senior']||0)*rates.Senior +
           (levelHrs['Staff']||0)*rates.Staff +
           (levelHrs['Intern']||0)*rates.Intern;
  }, [rates]);

  const getBookingStats = code => bookingStats.get(code) || { totalHrs: 0, levelHrs: {} };
  const getActualStats = code => actualStats.get(code) || { totalHrs: 0, levelHrs: {} };

  const [showImport,setShowImport]=useState(false);
  const [showTimesheet,setShowTimesheet]=useState(false);
  const [conflict,setConflict]=useState([]);
  const [pending,setPending]=useState([]);
  const [showConflict,setShowConflict]=useState(false);
  const [importOk,setImportOk]=useState(false);
  const [timesheetOk,setTimesheetOk]=useState(false);
  const [confirmDeleteId,setConfirmDeleteId]=useState(null);
  const [timesheetErrors,setTimesheetErrors]=useState([]);
  const [showTimesheetErrors,setShowTimesheetErrors]=useState(false);

  const processEntries=(entries)=>{
    const existingCodes=new Set(budgetData.map(b=>b.engagementCode));
    const conflicts=entries.filter(e=>existingCodes.has(e.engagementCode));
    if(conflicts.length>0){ setPending(entries); setConflict(conflicts); setShowConflict(true); }
    else{ const merged=[...budgetData,...entries.map(e=>({id:`${Date.now()}_${Math.random().toString(36).slice(2)}`,...e}))]; setBudgetData(merged); setImportOk(true); setTimeout(()=>setImportOk(false),2000); }
  };
  const handleOverride=()=>{
    const codes=new Set(pending.map(e=>e.engagementCode));
    const kept=budgetData.filter(b=>!codes.has(b.engagementCode));
    const updated=pending.map(e=>{ const existing=budgetData.find(b=>b.engagementCode===e.engagementCode); if(existing)return {...existing,...e}; return {id:`${Date.now()}_${Math.random().toString(36).slice(2)}`,...e}; });
    setBudgetData([...kept,...updated]); setShowConflict(false); setImportOk(true); setTimeout(()=>setImportOk(false),2000);
  };
  const handleSkip=()=>{
    const existingCodes=new Set(budgetData.map(b=>b.engagementCode));
    const newEntries=pending.filter(e=>!existingCodes.has(e.engagementCode)).map(e=>({id:`${Date.now()}_${Math.random().toString(36).slice(2)}`,...e}));
    setBudgetData([...budgetData,...newEntries]); setShowConflict(false); setImportOk(true); setTimeout(()=>setImportOk(false),2000);
  };
  const parseCSV=(file)=>{
    const reader=new FileReader();
    reader.onload=evt=>{
      const text=evt.target.result; const lines=splitCSVLines(text).filter(l=>l.trim()); if(lines.length<2)return;
      const hdr=parseCSVLine(lines[0]).map(h=>h.trim().replace(/^\uFEFF/,''));
      const rows=lines.slice(1).map(line=>{ const vals=parseCSVLine(line); const o=normalizeImportRow({}); hdr.forEach((h,i)=>{o[h]=vals[i]||'';}); return o; });
      try{processEntries(parseBudgetEntries(rows));}catch(error){alert('预算未导入：'+error.message);}
    }; reader.readAsText(file);
  };
  const parseExcel=(file)=>{
    const reader=new FileReader();
    reader.onload=evt=>{ const data=new Uint8Array(evt.target.result); const wb=XLSX.read(data,{type:'array',cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{defval:''}).map(normalizeImportRow); try{processEntries(parseBudgetEntries(rows));}catch(error){alert('预算未导入：'+error.message);} };
    reader.readAsArrayBuffer(file);
  };
  const handleFile=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f)return; const ext=(f.name.split('.').pop()||'').toLowerCase(); if(ext==='csv')parseCSV(f); else parseExcel(f); };

  const validateTimesheetRow=(e,i)=>{
    const invalid=[];
    e.employeeName=normalizeName(e.employeeName);
    if(!BookingStaff.isBookingName(e.employeeName))invalid.push({row:i+2,field:'Employee Name',value:e.employeeName,msg:'姓名为空或包含无法识别的字符；支持点号、空格和连续英文姓名'});
    else e.employeeName=normalizeName(e.employeeName);
    const nl=normalizeLevel(e.level);
    if(!nl)invalid.push({row:i+2,field:'Employee Rank',value:e.level,msg:'只能填 Senior、Staff、Manager、Intern'});
    else e.level=nl;
    const hrsNum=importNumber(e.hrsRaw);
    if(e.hrsRaw===''||!Number.isFinite(hrsNum))invalid.push({row:i+2,field:'Hours',value:e.hrsRaw,msg:'只能填数字'});
    else e.hrs=hrsNum;
    if(!isValidWeekRaw(e.dateRaw))invalid.push({row:i+2,field:'Transaction Cycle Date',value:String(e.dateRaw||''),msg:'日期无法识别、日期不存在或超出当前年份前后5年范围；支持年月日文本和 Excel 日期序号'});
    return invalid;
  };

  const parseTimesheetCSV=(file)=>{
    const reader=new FileReader();
    reader.onload=evt=>{
      const text=evt.target.result; const lines=splitCSVLines(text).filter(l=>l.trim()); if(lines.length<2)return;
      const hdr=parseCSVLine(lines[0]).map(h=>h.trim().replace(/^\uFEFF/,''));
      const rawEntries=lines.slice(1).map(line=>{
        const vals=parseCSVLine(line); const o=normalizeImportRow({}); hdr.forEach((h,i)=>{o[h]=vals[i]||'';});
        return {
          employeeName: String(o['Employee Name']||'').trim(),
          engagementCode: String(o['Engagement Code']||'').trim(),
          level: String(o['Employee Rank']||'').trim(),
          hrsRaw: String(o['Hours']||'').trim(),
          hrs:0,
          dateRaw: String(o['Transaction Cycle Date']||'').trim(),
        };
      }).filter(e=>e.engagementCode||e.employeeName);
      const invalid=[];
      rawEntries.forEach((e,i)=>{invalid.push(...validateTimesheetRow(e,i));});
      if(invalid.length>0){setTimesheetErrors(invalid);setShowTimesheetErrors(true);return;}
      const entries=rawEntries.map(e=>({employeeName:e.employeeName,engagementCode:e.engagementCode,level:e.level,hrs:e.hrs,date:parseWeekString(e.dateRaw).format('YYYY-MM-DD')})).filter(e=>e.engagementCode&&Number.isFinite(e.hrs));
      setTimesheetData(entries);
      setTimesheetOk(true); setTimeout(()=>setTimesheetOk(false),2000);
      setShowTimesheet(false);
    }; reader.readAsText(file);
  };
  const parseTimesheetExcel=(file)=>{
    const reader=new FileReader();
    reader.onload=evt=>{
      const data=new Uint8Array(evt.target.result); const wb=XLSX.read(data,{type:'array',cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{defval:''}).map(normalizeImportRow);
      const rawEntries=rows.map(row=>({
        employeeName: String(row['Employee Name']||'').trim(),
        engagementCode: String(row['Engagement Code']||'').trim(),
        level: String(row['Employee Rank']||'').trim(),
        hrsRaw: row['Hours'],
        hrs:0,
        dateRaw: row['Transaction Cycle Date'],
      })).filter(e=>e.engagementCode||e.employeeName);
      const invalid=[];
      rawEntries.forEach((e,i)=>{
        e.hrsRaw=String(e.hrsRaw??'').trim();
        e.dateRaw=e.dateRaw instanceof Date?e.dateRaw:String(e.dateRaw??'').trim();
        invalid.push(...validateTimesheetRow(e,i));
      });
      if(invalid.length>0){setTimesheetErrors(invalid);setShowTimesheetErrors(true);return;}
      const entries=rawEntries.map(e=>({employeeName:e.employeeName,engagementCode:e.engagementCode,level:e.level,hrs:e.hrs,date:parseWeekString(e.dateRaw).format('YYYY-MM-DD')})).filter(e=>e.engagementCode&&Number.isFinite(e.hrs));
      setTimesheetData(entries);
      setTimesheetOk(true); setTimeout(()=>setTimesheetOk(false),2000);
      setShowTimesheet(false);
    }; reader.readAsArrayBuffer(file);
  };
  const handleTimesheetFile=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f)return; const ext=(f.name.split('.').pop()||'').toLowerCase(); if(ext==='csv')parseTimesheetCSV(f); else parseTimesheetExcel(f); };

  const fmtNum = n => Number(n).toFixed(2).replace(/\.00$/,'');

  if(showTimesheet){
    return (
      <div className="budget-view">
        <div className="view-header"><h3>上传 Timesheet Listing</h3><button className="glass-btn export-btn" onClick={()=>setShowTimesheet(false)}><UIIcon name="back"/> 返回预算表</button></div>
        {navigation}
        <div className="import-page">
          <div className="import-card glass-card">
            <h3>上传 Timesheet Listing</h3>
            <div className="import-section">
              <div className="import-section-label">文件格式</div>
              <div className="import-section-content">支持 <code>.xlsx</code> <code>.xls</code> <code>.csv</code> 格式</div>
            </div>
            <div className="import-section">
              <div className="import-section-label">字段说明</div>
              <div className="import-section-content"><code>Employee Name</code> <code>Employee Rank</code> <code>Name</code> <code>Engagement Code</code> <code>Hours</code> <code>Transaction Cycle Date</code></div>
            </div>
            <div className="import-section">
              <div className="import-section-label">数据覆盖逻辑</div>
              <div className="import-section-content">每次上传默认覆盖之前的 Timesheet 数据</div>
            </div>
            <label className="upload-area"><input type="file" accept=".xlsx,.xls,.csv" onChange={handleTimesheetFile} className="file-input"/><div className="upload-icon"><UIIcon name="folder"/></div><div className="upload-text">点击选择文件上传</div></label>
            <button className="glass-btn" onClick={downloadTimesheetTemplate} style={{marginTop:16}}><UIIcon name="download"/> 下载 Template</button>
            {timesheetOk&&<div className="success-msg">✓ Timesheet 上传成功！</div>}
          </div>
        </div>
        {showTimesheetErrors&&(
          <div className="modal-overlay" onClick={()=>setShowTimesheetErrors(false)}>
            <div className="modal glass-card" onClick={e=>e.stopPropagation()}>
              <h3><UIIcon name="alert"/> Timesheet上传失败</h3>
              <p style={{color:"var(--muted)",marginBottom:8}}>以下记录格式不正确，请修正后重新上传：</p>
              <div className="conflict-list">
                {timesheetErrors.map((e,i)=><div key={i} className="conflict-item">第{e.row}行 {e.field}: "{e.value}" — {e.msg}</div>)}
              </div>
              <div className="modal-actions">
                <button className="glass-btn primary-btn" onClick={()=>setShowTimesheetErrors(false)}>确定</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  if(showImport){
    return (
      <div className="budget-view">
        <div className="view-header"><h3>上传预算</h3><button className="glass-btn export-btn" onClick={()=>setShowImport(false)}><UIIcon name="back"/> 返回预算表</button></div>
        {navigation}
        <div className="import-page">
          <div className="import-card glass-card">
            <h3>上传预算</h3>
            <div className="import-section">
              <div className="import-section-label">文件格式</div>
              <div className="import-section-content">支持 <code>.xlsx</code> <code>.xls</code> <code>.csv</code> 格式</div>
            </div>
            <div className="import-section">
              <div className="import-section-label">字段说明</div>
              <div className="import-section-content"><code>Engagement code</code> <code>Engagement Name</code> <code>budget hrs</code> <code>budget SER</code></div>
            </div>
            <div className="import-section">
              <div className="import-section-label">数据覆盖逻辑</div>
              <div className="import-section-content">已存在的项目会弹窗提示是否覆盖原数据或跳过保留</div>
            </div>
            <label className="upload-area"><input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="file-input"/><div className="upload-icon"><UIIcon name="folder"/></div><div className="upload-text">点击选择文件上传</div></label>
            <button className="glass-btn" onClick={downloadBudgetTemplate} style={{marginTop:16}}><UIIcon name="download"/> 下载 Template</button>
            {importOk&&<div className="success-msg">✓ 上传成功！</div>}
          </div>
        </div>
        {showConflict&&(<div className="modal-overlay" onClick={()=>setShowConflict(false)}><div className="modal glass-card" onClick={e=>e.stopPropagation()}><h3><UIIcon name="alert"/> 发现重复项目</h3><p style={{color:"var(--muted)",marginBottom:8}}>以下项目已存在于预算表中：</p><div className="conflict-list">{conflict.map((e,i)=><div key={i} className="conflict-item">{e.engagementCode} - {e.engagementName}</div>)}</div><p style={{fontSize:13,color:"var(--muted)"}}>请选择处理方式：</p><div className="modal-actions"><button className="glass-btn" onClick={handleSkip}>跳过重复，保留原数据</button><button className="glass-btn primary-btn" onClick={handleOverride}>覆盖原数据</button><button className="glass-btn" onClick={()=>setShowConflict(false)}>取消上传</button></div></div></div>)}
      </div>
    );
  }

  return (
    <div className="budget-view">
      <div className="view-header"><PageHeading title="项目预算" label="PROJECT BUDGET" detail="预算、排班与实际投入"/><div className="view-actions">
        {timesheetOk&&<span style={{color:'#059669',fontWeight:600,fontSize:13,padding:'6px 0'}}>✓ Timesheet已上传</span>}
        <button className="glass-btn export-btn" onClick={()=>exportBudgetCSV(budgetData)}><UIIcon name="download"/> 导出预算</button>
        <button className="glass-btn export-btn" onClick={()=>setShowImport(true)}><UIIcon name="upload"/> 上传预算</button>
        <button className="glass-btn export-btn" onClick={()=>setShowTimesheet(true)}><UIIcon name="upload"/> 上传Timesheet</button>
        <button className="glass-btn primary-btn" onClick={addBudgetRow}><UIIcon name="plus"/> 新增项目预算</button>
      </div></div>
      {navigation}
      <div className="view-toolbar"><span className="rate-label">每小时费率</span><div className="budget-rate-bar" style={{padding:0,background:'transparent',border:'none'}}>
          <RateEdit label="Manager" value={rates.Manager} level="Manager" rates={rates} onRatesChange={onRatesChange} />
          <RateEdit label="Senior" value={rates.Senior} level="Senior" rates={rates} onRatesChange={onRatesChange} />
          <RateEdit label="Staff" value={rates.Staff} level="Staff" rates={rates} onRatesChange={onRatesChange} />
          <RateEdit label="Intern" value={rates.Intern} level="Intern" rates={rates} onRatesChange={onRatesChange} />
      </div></div>
      {budgetData.length===0?<div className="empty-state">暂无项目预算，请点击“新增项目预算”或“上传预算”添加</div>:(
        <div className="budget-grid-container">
          <div className="grid-scroll" style={{flex:1}}>
            <table className="budget-grid">
              <thead>
                <tr style={{position:'sticky',top:0,zIndex:11}}>
                  <th rowSpan="2" className="budget-base" style={{width:140}}>Engagement code</th>
                  <th rowSpan="2" className="budget-base" style={{width:200}}>Engagement Name</th>
                  <th colSpan="2" className="budget-budget">budget</th>
                  <th colSpan="2" className="budget-booking">booking</th>
                  <th colSpan="2" className="budget-actual">actual</th>
                  <th rowSpan="2" className="budget-base" style={{width:110}}>预算管理基准</th>
                  <th colSpan="3" className="budget-compare">budget vs booking</th>
                  <th colSpan="3" className="budget-overrun">budget vs actual</th>
                  <th rowSpan="2" className="budget-remark">备注</th>
                  <th rowSpan="2" className="budget-action" style={{width:60}}>操作</th>
                </tr>
                <tr style={{position:'sticky',top:38,zIndex:11}}>
                  <th className="budget-budget">hrs</th><th className="budget-budget">SER</th>
                  <th className="budget-booking">hrs</th><th className="budget-booking">SER</th>
                  <th className="budget-actual">hrs</th><th className="budget-actual">SER</th>
                  <th className="budget-compare">hrs diff</th><th className="budget-compare">SER diff</th><th className="budget-compare" style={{width:100}}>是否超支</th>
                  <th className="budget-overrun">hrs diff</th><th className="budget-overrun">SER diff</th><th className="budget-overrun" style={{width:100}}>是否超支</th>
                </tr>
              </thead>
              <tbody>
                {budgetData.map(row => {
                  const bStats = getBookingStats(row.engagementCode);
                  const bookingHrs = bStats.totalHrs;
                  const bookingSER = computeSER(bStats.levelHrs);
                  const bHrsDiff = bookingHrs - row.budgetHrs;
                  const bSerDiff = bookingSER - row.budgetSER;
                  const bHrsDiffClass = (row.benchmark === 'hrs' && bHrsDiff > 0) ? 'negative' : 'positive';
                  const bSerDiffClass = (row.benchmark === 'SER' && bSerDiff > 0) ? 'negative' : 'positive';
                  const bOver = row.benchmark==='SER' ? bSerDiff > 0 : bHrsDiff > 0;
                  const bOverClass = bOver ? 'negative' : 'positive';

                  const aStats = getActualStats(row.engagementCode);
                  const actualHrs = aStats.totalHrs;
                  const actualSER = computeSER(aStats.levelHrs);
                  const aHrsDiff = actualHrs - row.budgetHrs;
                  const aSerDiff = actualSER - row.budgetSER;
                  const aHrsDiffClass = (row.benchmark === 'hrs' && aHrsDiff > 0) ? 'negative' : 'positive';
                  const aSerDiffClass = (row.benchmark === 'SER' && aSerDiff > 0) ? 'negative' : 'positive';
                  const aOver = row.benchmark==='SER' ? aSerDiff > 0 : aHrsDiff > 0;
                  const aOverClass = aOver ? 'negative' : 'positive';

                  return (
                    <tr key={row.id}>
                      <EditableCell value={row.engagementCode} onChange={v=>updateBudgetRow(row.id,{engagementCode:String(v).trim()})} type="text" align="left" />
                      <EditableCell value={row.engagementName} onChange={v=>updateBudgetRow(row.id,{engagementName:String(v).trim()})} type="text" align="left" />
                      <EditableCell value={row.budgetHrs} onChange={v=>updateBudgetRow(row.id,{budgetHrs:v})} type="number" />
                      <EditableCell value={row.budgetSER} onChange={v=>updateBudgetRow(row.id,{budgetSER:v})} type="number" />
                      <td>{fmtNum(bookingHrs)}</td>
                      <td>{fmtNum(bookingSER)}</td>
                      <td>{fmtNum(actualHrs)}</td>
                      <td>{fmtNum(actualSER)}</td>
                      <DropdownCell value={row.benchmark} options={['hrs','SER']} onChange={v=>updateBudgetRow(row.id,{benchmark:v})} />
                      <td className={bHrsDiffClass}>{fmtNum(bHrsDiff)}</td>
                      <td className={bSerDiffClass}>{fmtNum(bSerDiff)}</td>
                      <td className={bOverClass}>{bOver?'超支':'不超支'}</td>
                      <td className={aHrsDiffClass}>{fmtNum(aHrsDiff)}</td>
                      <td className={aSerDiffClass}>{fmtNum(aSerDiff)}</td>
                      <td className={aOverClass}>{aOver?'超支':'不超支'}</td>
                      <EditableCell value={row.remark} onChange={v=>updateBudgetRow(row.id,{remark:v})} type="text" align="left" />
                      <td><button className="glass-btn danger-btn" style={{padding:'4px 10px',fontSize:12}} onClick={()=>setConfirmDeleteId(row.id)}>删除</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {confirmDeleteId && (
        <div className="modal-overlay" onClick={()=>setConfirmDeleteId(null)}>
          <div className="modal glass-card" onClick={e=>e.stopPropagation()}>
            <h3>确认删除</h3>
            <p style={{color:"var(--muted)",marginTop:8}}>确定要删除该项目预算吗？此操作不可恢复。</p>
            <div className="modal-actions">
              <button className="glass-btn" onClick={()=>setConfirmDeleteId(null)}>取消</button>
              <button className="glass-btn danger-btn" onClick={()=>{ deleteBudgetRow(confirmDeleteId); setConfirmDeleteId(null); }}>确认删除</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== OU BOOKING VIEW ====================
function OUBookingView({navigation,data,setSub,fyFilter,toggleFY}){
  const {weeks,personWeeks}=useDataModel(data,fyFilter);
  const [collapsedEic,setCollapsedEic]=useState(new Set());
  const [collapsedPerson,setCollapsedPerson]=useState(new Set());
  const [showExport,setShowExport]=useState(false);
  const [showLocator,setShowLocator]=useState(false);
  const [locateWeek,setLocateWeek]=useState('');
  const [projectFilter,setProjectFilter]=useState('');
  const gridRef=useRef(null);


  useEffect(()=>{if(gridRef.current&&weeks.length>0){const t=getFridayOfWeek(dayjs()).format('YYYY-MM-DD');const i=weeks.findIndex(w=>w.fridayDate===t);if(i>=0){const th=gridRef.current.querySelector('.col-week');setTimeout(()=>{if(gridRef.current)gridRef.current.scrollLeft=Math.max(0,i*(th?th.getBoundingClientRect().width:80));},150);}}},[weeks]);

  const scrollToWeek=(w)=>{
    const idx=weeks.findIndex(week=>week.fridayDate===w);
    const grid=gridRef.current;
    if(idx>=0&&grid){
      const weekTh=grid.querySelector('.col-week');
      const weekW=weekTh?weekTh.getBoundingClientRect().width:80;
      const target=Math.max(0,idx*weekW);
      if(target===0&&grid.scrollLeft===0){
        grid.scrollTo({left:weekW,behavior:'smooth'});
        setTimeout(()=>grid.scrollTo({left:0,behavior:'smooth'}),250);
      }else{
        grid.scrollTo({left:target,behavior:'smooth'});
      }
    }
    setShowLocator(false);setLocateWeek('');
  };

  useEffect(()=>{
    const root=document.documentElement;
    let dragTarget=null,startX=0,startW=0,prop='';
    const onDown=e=>{
      const handle=e.target.closest('.resize-handle');
      if(!handle)return;
      dragTarget=handle.parentElement;
      prop=dragTarget.classList.contains('col-name')?'--col-name-w':'--col-proj-w';
      startX=e.clientX;startW=parseFloat(getComputedStyle(root).getPropertyValue(prop))||100;
      e.preventDefault();
    };
    const onMove=e=>{if(!dragTarget)return;const delta=e.clientX-startX;const newW=Math.max(60,Math.min(400,startW+delta));root.style.setProperty(prop,newW+'px');};
    const onUp=()=>{dragTarget=null;};
    document.addEventListener('mousedown',onDown);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousedown',onDown);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  },[]);

  const allProjects=useMemo(()=>{const m=new Map();data.forEach(e=>m.set(e.engagementCode,e.engagementName));return Array.from(m,([c,n])=>({code:c,name:n}));},[data]);

  const eicGroups=useMemo(()=>{
    const groups=new Map();
    personWeeks.forEach(pw=>{const eic=pw.eic||'Unknown';if(!groups.has(eic))groups.set(eic,[]);groups.get(eic).push(pw);});
    return Array.from(groups.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  },[personWeeks]);

  const toggleEic=e=>setCollapsedEic(prev=>{const n=new Set(prev);n.has(e)?n.delete(e):n.add(e);return n;});
  const togglePerson=n=>setCollapsedPerson(prev=>{const next=new Set(prev);next.has(n)?next.delete(n):next.add(n);return next;});

  const getProjectWeekHrs=(pw,week,code)=>{
    const entries=(pw.weeks[week]||[]).filter(e=>e.code===code);
    return entries.reduce((s,e)=>s+e.hrs,0);
  };

  return (
    <div className="booking-view">
      <div className="view-header">
        <PageHeading title="OU排班情况" detail={Array.from(fyFilter).sort().join(' · ')+' / 每周工时'}/>
        <div className="view-actions"><button className="glass-btn" onClick={()=>setShowExport(true)}><UIIcon name="download"/>导出排班</button><button className="glass-btn primary-btn" onClick={()=>setSub('upload')}><UIIcon name="upload"/>上传EIC管理数据</button></div>
      </div>
      {navigation}
      <div className="view-toolbar"><FYCheckboxDropdown fyFilter={fyFilter} toggleFY={toggleFY}/><select className="glass-btn project-filter" aria-label="项目筛选" value={projectFilter} onChange={e=>setProjectFilter(e.target.value)}><option value="">全部项目</option>{allProjects.map(p=><option key={p.code} value={p.code}>{p.code} - {p.name}</option>)}</select><div className="toolbar-secondary"><button className="glass-btn" onClick={()=>{const names=personWeeks.map(pw=>pw.name);const allCollapsed=names.length>0&&collapsedPerson.size===names.length;setCollapsedPerson(allCollapsed?new Set():new Set(names));}}><UIIcon name="people"/>人员{personWeeks.length>0&&collapsedPerson.size===personWeeks.length?'展开':'折叠'}</button><button className="glass-btn" onClick={()=>{const allCollapsed=eicGroups.length>0&&collapsedEic.size===eicGroups.length;setCollapsedEic(allCollapsed?new Set():new Set(eicGroups.map(([e])=>e)));}}><UIIcon name="folder"/>EIC{eicGroups.length>0&&collapsedEic.size===eicGroups.length?'展开':'折叠'}</button><button className="glass-btn" onClick={()=>setShowLocator(true)}><UIIcon name="locate"/>定位周</button></div></div>
      {weeks.length===0?<div className="empty-state">暂无排班数据，请先上传EIC管理数据</div>:(
        <div className="grid-container"><div className="grid-scroll" ref={gridRef}>
          <table className="booking-grid" style={{"--week-count":weeks.length}}><thead><tr><th className="col-name">姓名<div className="resize-handle"></div></th><th className="col-project">项目<div className="resize-handle"></div></th>{weeks.map(w=><th key={w.fridayDate} className={"col-week"+(w.fridayDate===getFridayOfWeek(dayjs()).format("YYYY-MM-DD")?" is-current":"")}><div className="week-header"><span className="week-fy">{w.label.split(" ")[0]} </span>{w.label.split(" ").slice(1).join(" ")}</div><div className="week-avail">{w.availableHrs}h</div></th>)}</tr></thead>
            <tbody>
              {eicGroups.map(([eic,members])=>{
                const visibleMembers=projectFilter
                  ? members.filter(pw=>weeks.some(w=>getProjectWeekHrs(pw,w.fridayDate,projectFilter)>0))
                  : members;
                if(visibleMembers.length===0)return null;
                const isEicColl=collapsedEic.has(eic);
                const eicColor=EIC_ROW_COLOR;
                return <React.Fragment key={eic}>
                  <tr className="eic-header-row">
                    <td style={{overflow:'hidden',background:eicColor,color:"var(--ink)",borderBottom:'1px solid '+eicColor,boxShadow:'4px 0 0 0 #FFFFFF'}} colSpan={2}>
                      <span className="eic-toggle" onClick={()=>!projectFilter&&toggleEic(eic)}>{projectFilter?'▼':(isEicColl?'▶':'▼')}</span>
                      <div style={{marginLeft:20,marginTop:2}}>
                        <strong>{eic}</strong>
                        <span style={{marginLeft:8,fontSize:11,color:"var(--muted)"}}>({visibleMembers.length}人)</span>
                      </div>
                    </td>
                    {!projectFilter&&weeks.map(w=>{
                      let total=0,idle=0;
                      members.forEach(m=>{total+=m.subtotals[w.fridayDate]||0;idle+=m.idles[w.fridayDate]||0;});
                      return <td key={w.fridayDate} className="col-week subtotal-cell" style={{background:eicColor}}><span className="hrs-value">{total}</span>{idle>0&&<span className="idle-badge">{idle}</span>}</td>;
                    })}
                    {projectFilter&&weeks.map(w=><td key={w.fridayDate} className="col-week" style={{background:eicColor}}></td>)}
                  </tr>
                  {!projectFilter&&!isEicColl&&members.map(pw=>{
                    const projects=[];const seen=new Set();
                    weeks.forEach(w=>{(pw.weeks[w.fridayDate]||[]).forEach(e=>{if(!seen.has(e.code)){seen.add(e.code);projects.push(e);}});});
                    const isPColl=collapsedPerson.has(pw.name);

// ==================== OU IDLE VIEW ====================
function OUIdleView({navigation,data,fyFilter,toggleFY}){
  const {weeks,personWeeks}=useDataModel(data,fyFilter);
  const [collapsedEic,setCollapsedEic]=useState(new Set());
  const [showLocator,setShowLocator]=useState(false);
  const [locateWeek,setLocateWeek]=useState('');
  const gridRef=useRef(null);


  useEffect(()=>{if(gridRef.current&&weeks.length>0){const t=getFridayOfWeek(dayjs()).format('YYYY-MM-DD');const i=weeks.findIndex(w=>w.fridayDate===t);if(i>=0){const th=gridRef.current.querySelector('.col-week');setTimeout(()=>{if(gridRef.current)gridRef.current.scrollLeft=Math.max(0,i*(th?th.getBoundingClientRect().width:80));},150);}}},[weeks]);

  const scrollToWeek=(w)=>{
    const idx=weeks.findIndex(week=>week.fridayDate===w);
    const grid=gridRef.current;
    if(idx>=0&&grid){
      const weekTh=grid.querySelector('.col-week');
      const weekW=weekTh?weekTh.getBoundingClientRect().width:80;
      const target=Math.max(0,idx*weekW);
      if(target===0&&grid.scrollLeft===0){
        grid.scrollTo({left:weekW,behavior:'smooth'});
        setTimeout(()=>grid.scrollTo({left:0,behavior:'smooth'}),250);
      }else{
        grid.scrollTo({left:target,behavior:'smooth'});
      }
    }
    setShowLocator(false);setLocateWeek('');
  };

  useEffect(()=>{
    const root=document.documentElement;
    let dragTarget=null,startX=0,startW=0,prop='';
    const onDown=e=>{
      const handle=e.target.closest('.resize-handle');
      if(!handle)return;
      dragTarget=handle.parentElement;
      prop=dragTarget.classList.contains('col-name')?'--col-name-w':'--col-proj-w';
      startX=e.clientX;startW=parseFloat(getComputedStyle(root).getPropertyValue(prop))||100;
      e.preventDefault();
    };
    const onMove=e=>{if(!dragTarget)return;const delta=e.clientX-startX;const newW=Math.max(60,Math.min(400,startW+delta));root.style.setProperty(prop,newW+'px');};
    const onUp=()=>{dragTarget=null;};
    document.addEventListener('mousedown',onDown);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousedown',onDown);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  },[]);

  const eicGroups=useMemo(()=>{
    const groups=new Map();
    personWeeks.forEach(pw=>{const eic=pw.eic||'Unknown';if(!groups.has(eic))groups.set(eic,[]);groups.get(eic).push(pw);});
    return Array.from(groups.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  },[personWeeks]);

  const toggleEic=e=>setCollapsedEic(prev=>{const n=new Set(prev);n.has(e)?n.delete(e):n.add(e);return n;});

  return (
    <div className="idle-view">
      <div className="view-header"><PageHeading title="OU IDLE情况" detail={Array.from(fyFilter).sort().join(' · ')} /></div>
      {navigation}
      <div className="view-toolbar"><FYCheckboxDropdown fyFilter={fyFilter} toggleFY={toggleFY}/><div className="toolbar-secondary"><button className="glass-btn" onClick={()=>setShowLocator(true)}><UIIcon name="locate"/>定位周</button></div></div>
      {weeks.length===0?<div className="empty-state">暂无排班数据</div>:(
        <div className="grid-container"><div className="grid-scroll" ref={gridRef}>
          <table className="booking-grid idle-grid" style={{"--week-count":weeks.length}}><thead><tr><th className="col-name">姓名<div className="resize-handle"></div></th><th className="col-project">IDLE<div className="resize-handle"></div></th>{weeks.map(w=><th key={w.fridayDate} className={"col-week"+(w.fridayDate===getFridayOfWeek(dayjs()).format("YYYY-MM-DD")?" is-current":"")}><div className="week-header"><span className="week-fy">{w.label.split(" ")[0]} </span>{w.label.split(" ").slice(1).join(" ")}</div><div className="week-avail">{w.availableHrs}h</div></th>)}</tr></thead>
            <tbody>
              {eicGroups.map(([eic,members])=>{
                const isColl=collapsedEic.has(eic);
                const eicColor=EIC_ROW_COLOR;
                return <React.Fragment key={eic}>
                  <tr className="eic-header-row">
                    <td style={{overflow:'hidden',background:eicColor,color:"var(--ink)",borderBottom:'1px solid '+eicColor,boxShadow:'4px 0 0 0 #FFFFFF'}} colSpan={2}>
                      <span className="eic-toggle" onClick={()=>toggleEic(eic)}>{isColl?'▶':'▼'}</span>
                      <div style={{marginLeft:20,marginTop:2}}>
                        <strong>{eic}</strong>
                        <span style={{marginLeft:8,fontSize:11,color:"var(--muted)"}}>({members.length}人)</span>
                      </div>
                    </td>
                    {weeks.map(w=>{
                      let total=0;members.forEach(m=>total+=m.idles[w.fridayDate]||0);
                      return <td key={w.fridayDate} className="col-week idle-cell" style={{background:eicColor}}><span className={`idle-value ${total>0?'has-idle':''}`}>{total}</span></td>;
                    })}
                  </tr>
                  {!isColl&&members.map(pw=><tr key={pw.name} className="idle-row">
                    <td className="col-name"><StaffName name={pw.name} level={pw.level}/></td>
                    <td className="col-project idle-label">Idle Hours</td>
                    {weeks.map(w=><td key={w.fridayDate} className="col-week idle-cell"><span className={`idle-value ${pw.idles[w.fridayDate]>0?'has-idle':''}`}>{pw.idles[w.fridayDate]||0}</span></td>)}
                  </tr>)}
                </React.Fragment>;
              })}
            </tbody>
          </table>
        </div></div>
      )}
      {showLocator&&<WeekLocator weeks={weeks} value={locateWeek} onChange={setLocateWeek} onGo={scrollToWeek} onClose={()=>setShowLocator(false)}/>}
    </div>
  );
}

function utColor(pct){
  if(pct===0)return '#7C3AED';
  if(pct<100)return '#2563EB';
  if(pct===100)return '#16A34A';
  if(pct<=125)return '#CA8A04';
  if(pct<=145)return '#D97706';
  return '#DC2626';
}

function EditModal({code,ename,hrs,isNew,projects,onSave,onRemove,onClose,existingNames,existingLevels,existingEICs}){
  const [c,setC]=useState(code||'');
  const [n,setN]=useState(ename||'');
  const [h,setH]=useState(hrs||0);
  const [showSearch,setShowSearch]=useState(false);
  const [search,setSearch]=useState('');
  const [remove,setRemove]=useState(false);
  const wrapRef=useRef(null);
  const [err,setErr]=useState('');

  const [newName,setNewName]=useState('');
  const [isNameNew,setIsNameNew]=useState(false);
  const [newLevel,setNewLevel]=useState('Senior');
  const [newEic,setNewEic]=useState('');

  useEffect(()=>{
    if(!showSearch) return;
    const handler=(e)=>{ if(wrapRef.current && !wrapRef.current.contains(e.target)) setShowSearch(false); };
    document.addEventListener('mousedown',handler);
    return ()=>document.removeEventListener('mousedown',handler);
  },[showSearch]);

  const filtered=projects.filter(p=>p.code.toLowerCase().includes(search.toLowerCase())||p.name.toLowerCase().includes(search.toLowerCase()));

  const handleSave=()=>{
    setErr('');
    if(remove){onRemove();return;}
    if(isNameNew){
      if(!newName.trim()||!BookingStaff.isBookingName(newName.trim())){setErr('正式姓名须以英文点号分隔；待入职人员可使用中文名');return;}
      if(newEic.trim()&&!NAME_PATTERN.test(newEic.trim())){setErr('EIC格式不正确（须为英文.连接，如 First.Last）');return;}
    }
    if(!c.trim()){setErr('请选择或输入 Engagement Code');return;}
    if(!n.trim()){setErr('请填写 Engagement Name');return;}
    if(!h||h<=0){setErr('Hours 必须大于0');return;}
    onSave(c,n,h,newName.trim()?normalizeName(newName):undefined,isNameNew?newLevel:undefined,isNameNew?normalizeName(newEic):undefined);
  };

  const handleNameSelect=(v)=>{
    if(v==='__new__'){setIsNameNew(true);setNewName('');return;}
    setIsNameNew(false);setNewName(v);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e=>e.stopPropagation()} style={{maxWidth:'520px'}}>
        <h3>{isNew?'新增排班':'编辑排班'}</h3>
        <div className="edit-form">
          {existingNames&&existingNames.length>0&&<div className="form-group">
            <label>姓名（可搜索或下拉选择）</label>
            <PersonPicker label="排班人员" value={isNameNew?'__new__':newName} onChange={handleNameSelect}
              options={[{value:'',label:'保持当前行',utility:true},...existingNames.map(personOption),{value:'__new__',label:'手动输入新姓名…',utility:true}]}/>
            {isNameNew&&<input type="text" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="格式：First.Last" autoFocus style={{marginTop:'6px'}}/>}
            {isNameNew&&<>
              <div style={{display:'flex',gap:'8px',marginTop:'6px'}}>
                <div className="form-group" style={{flex:1}}><label>Level</label>                <select value={newLevel} onChange={e=>setNewLevel(e.target.value)}>
                  <option value="Manager">Manager</option><option value="Senior">Senior</option><option value="Staff">Staff</option><option value="Intern">Intern</option>
                </select></div>
                <div className="form-group" style={{flex:1}}><label>EIC</label><input type="text" value={newEic} onChange={e=>setNewEic(e.target.value)} placeholder="First.Last"/></div>
              </div>
            </>}
          </div>}
          <div className="form-group">
            <label>Engagement Code（可选已有/预算项目，可手动输入新Code）</label>
            <div className="search-input-wrap" ref={wrapRef}>

              {showSearch&&<div className="search-dropdown">
                <input type="text" className="search-inner" value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜索..." autoFocus/>
                <div className="search-results">
                  {filtered.map(p=><div key={p.code} className="search-item" onClick={()=>{setC(p.code);setN(p.name);setShowSearch(false);setSearch('');}}><span className="search-code">{p.code}</span><span className="search-name">{p.name}</span></div>)}
                  {filtered.length===0&&<div className="search-empty">无匹配结果，可手动输入新项目</div>}
                </div>
              </div>}
            </div>
          </div>
          <div className="form-group"><label>Engagement Name</label><input type="text" value={n} onChange={e=>setN(e.target.value)} placeholder="项目名称"/></div>
          <div className="form-group"><label>Hours</label><input type="number" value={h} onChange={e=>setH(Number(e.target.value))} min={0} max={168} step={0.5}/></div>
