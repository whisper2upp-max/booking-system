function TaskAssigneeModal({ task, options, onSave, onClose }) {
  const [selected, setSelected] = useState(() => new Set(task.assignees || []));
  const toggle = (name) => setSelected(prev => {
    const next = new Set(prev);
    if (next.has(name)) next.delete(name); else next.add(name);
    return next;
  });
  return (
    <div className="modal-overlay tasklist-sub-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e => e.stopPropagation()} style={{maxWidth:'520px'}}>
        <h3>选择分工对象</h3>
        <div style={{fontSize:'12px',color:"var(--muted)",marginBottom:'12px',lineHeight:1.5}}>{task.engagementName}<br/>{task.taskDescription}</div>
        {options.length > 0 ? (
          <PersonSearchList names={options} selected={selected} onToggle={toggle} label="搜索 Task 分工人员" rowClassName="task-assignee-option"/>
        ) : <div style={{padding:'22px',background:'#FFFBEB',borderRadius:'8px',color:'#92400E',fontSize:'13px',lineHeight:1.6}}>当前经理的项目暂无已排班人员。请先在排班管理中完成排班，再返回选择分工对象。</div>}
        <div className="modal-actions">
          {options.length > 0 && <button className="glass-btn" onClick={() => setSelected(new Set())}>清空</button>}
          <div style={{flex:1}}></div>
          <button className="glass-btn" onClick={onClose}>取消</button>
          <button className="glass-btn primary-btn" onClick={() => onSave(Array.from(selected))} disabled={options.length === 0}>确认</button>
        </div>
      </div>
    </div>
  );
}

function TaskSplitModal({ task, onSplit, onClose }) {
  const [count, setCount] = useState(2);
  const validCount = Math.max(2, Math.min(50, Math.floor(Number(count) || 2)));
  return (
    <div className="modal-overlay tasklist-sub-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e => e.stopPropagation()} style={{maxWidth:'500px'}}>
        <h3>拆分 Task</h3>
        <div style={{fontSize:'12px',color:"var(--muted)",lineHeight:1.5}}>{task.engagementName}<br/>{task.taskDescription}</div>
        <div className="task-split-count">
          <label style={{fontSize:'13px',fontWeight:600,color:"var(--text)"}}>拆分后的总条数</label>
          <input type="number" min="2" max="50" value={count} onChange={e => setCount(e.target.value)} />
          <span style={{fontSize:'12px',color:"var(--muted)"}}>2–50 条</span>
        </div>
        <div style={{fontSize:'12px',color:"var(--text)",lineHeight:1.6}}>原 Task 将替换为 {validCount} 条内容完全相同的 Task；拆分后可逐条修改。</div>
        <div className="modal-actions">
          <button className="glass-btn" onClick={onClose}>取消</button>
          <button className="glass-btn primary-btn" onClick={() => onSplit(validCount)}>拆分为 {validCount} 条</button>
        </div>
      </div>
    </div>
  );
}


// ==================== IMPORT MODAL ====================
function ImportModal({ onImport, onClose }) {
  const inputRef = useRef(null);
  const [msg, setMsg] = useState('');

  const handleFile = useCallback(async (file) => {
    if (!file) return;
    setMsg('正在导入...');
    const success = await onImport(file);
    setMsg(success ? '导入成功' : '导入未完成，请按提示修正后重试');
    if (success) setTimeout(() => onClose(), 800);
  }, [onImport, onClose]);

  const handleDownloadTemplate = useCallback(() => {
    const rows = [['Engagement Name','FIC','Engagement Code(必填-用于匹配)','Section','底稿数规模','项目预算(来自排班,只读)','项目组EIC','项目组FIC','节点名称','节点分组','具体日期','完成状态','进展说明','服务单号','订单号','Canvas ID']];
    const eligible = STAFF_MASTER.filter(person=>BookingStaff.isFicName(person.name,STAFF_MASTER));
    rows.push(['示例项目',eligible[0]?.name||'','AUD-001','华东区','100','500,000',eligible[0]?.eic||'',eligible[1]?.name||'','PBC发出','年审',dayjs().add(5,'day').format('YYYY-MM-DD'),'','','','','']);
    const csv = '\uFEFF' + rows.map(r => r.map(escapeCSV).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'project_nodes_template.csv';
    a.click(); URL.revokeObjectURL(url);
  }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e => e.stopPropagation()} style={{textAlign:'center',maxWidth:'560px'}}>
        <h3>导入节点数据</h3>
        <div className="import-section">
          <div className="import-section-label">文件格式</div>
          <div className="import-section-content">支持 <code>.xlsx</code> <code>.xls</code> <code>.csv</code> 格式</div>
        </div>
        <div className="import-section">
          <div className="import-section-label">字段说明</div>
          <div className="import-section-content"><code>Engagement Code</code>（必填，用于匹配）<code>FIC</code> <code>Section</code> <code>底稿数规模</code> <code>项目组EIC</code> <code>项目组FIC</code> <code>服务单号</code> <code>订单号</code> <code>Canvas ID</code> <code>节点名称</code> <code>节点分组</code> <code>具体日期</code> <code>完成状态</code> <code>进展说明</code>。按列名识别，列顺序可调整。</div>
        </div>
        <div className="import-section"><div className="import-section-label">FIC 人员</div><div className="import-section-content">FIC 与项目组 FIC 须为 masterdata 中的 Senior 或 Staff，不能使用 Manager。</div></div>
        <div className="import-section">
          <div className="import-section-label">数据覆盖逻辑</div>
          <div className="import-section-content">按 Engagement Code 匹配已有项目；项目信息非空覆盖、空白或缺列保留。项目名称和预算不从此入口更新。节点只追加，不替换原节点；只更新信息时不填节点列。</div>
        </div>
        <div className="import-section"><div className="import-section-label">只上传编号</div><div className="import-section-content">仅保留 Engagement Code、服务单号、订单号三列即可；两个编号可选填，Excel 中按文本填写可保留前导 0 和完整长编号。</div></div>
        <div className="upload-area" onClick={() => inputRef.current?.click()} style={{cursor:'pointer',marginBottom:'20px'}}>
          <div className="upload-icon"><UIIcon name="folder"/></div>
          <div className="upload-text">点击选择文件上传</div>
          <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" className="file-input"
            onChange={e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value = ''; }} />
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:'12px',marginTop:'8px'}}>
          <button className="glass-btn" onClick={handleDownloadTemplate} style={{fontSize:'13px',padding:'8px 20px'}}><UIIcon name="file"/> 下载模板</button>
        </div>
        {msg && <div className="success-msg" style={msg.includes('正在') ? {color:'#D97706',background:'rgba(217,119,6,0.08)'} : msg.includes('未完成') ? {color:'#b94332',background:'#fdf0ed'} : {}}>{msg}</div>}
      </div>
    </div>
  );
}


// ==================== PROJECT EDIT MODAL ====================
function ProjectEditModal({ project, onSave, onDelete, onClose }) {
  const [name, setName] = useState(project?.name || '');
  const [fic, setFic] = useState(project?.fic || '');
  const [code, setCode] = useState(project?.code || '');
  const [section, setSection] = useState(project?.section || '');
  const [papers, setPapers] = useState(project?.papers || '');
  const [budget, setBudget] = useState(project?.budget || '');
  const [eic, setEic] = useState(project?.eic || '');
  const [teamFic, setTeamFic] = useState(project?.teamFic || '');
  const [serviceOrderNo,setServiceOrderNo]=useState(String(project?.serviceOrderNo??''));
  const [orderNo,setOrderNo]=useState(String(project?.orderNo??''));
  const [canvasId,setCanvasId]=useState(String(project?.canvasId??''));
  const [err, setErr] = useState('');

  const handleSave = () => {
    if (!name.trim() || !fic.trim()) return;
    if (!BookingStaff.isFicName(fic,STAFF_MASTER)) { setErr('FIC 请选择 masterdata 中的 Senior 或 Staff，不能选择 Manager。'); return; }
    if (eic.trim() && !/^[A-Za-z0-9.-]+(?:\s*[,，]\s*[A-Za-z0-9.-]+)*$/.test(eic.trim())) { setErr('项目组EIC格式不正确，须为英文.连接（如 Example.Person）'); return; }
    if (teamFic.trim() && !BookingStaff.isFicName(teamFic,STAFF_MASTER)) { setErr('项目组 FIC 请选择 masterdata 中的 Senior 或 Staff，不能选择 Manager。'); return; }
    try{onSave({ name: name.trim(), fic: BookingStaff.findByName(fic,STAFF_MASTER).name, code: code.trim(), section: section.trim(), papers: papers.trim(), budget: budget.trim(), eic: eic.trim()?normalizeName(eic.trim()):'', teamFic: teamFic.trim()?BookingStaff.findByName(teamFic,STAFF_MASTER).name:'',serviceOrderNo:serviceOrderNo.trim(),orderNo:orderNo.trim(),canvasId:canvasId.trim() });}
    catch(e){setErr(e.message||'保存失败，请重试。');}
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e => e.stopPropagation()} style={{maxWidth:'600px'}}>
        <h3>编辑项目信息</h3>
        <div className="node-form project-info-form">
          <div className="form-group"><label>Engagement Name <span style={{color:'#DC2626'}}>*</span></label><input aria-label="项目名称" type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="必填" /></div>
          <div className="form-group"><label>FIC <span style={{color:'#DC2626'}}>*</span></label><PersonPicker label="项目 FIC" value={fic} onChange={value=>{setFic(value);setErr('');}} placeholder="搜索或选择 FIC（必填）" options={STAFF_MASTER.filter(person=>BookingStaff.isFicName(person.name,STAFF_MASTER)).map(person=>personOption(person.name))}/><small className="fic-picker-hint">masterdata 中的 Senior 或 Staff</small></div>
          <div className="form-group"><label>Engagement Code</label><input aria-label="项目编码" type="text" value={code} onChange={e=>setCode(e.target.value)} placeholder="选填" /></div>
          <div className="form-group"><label>主要承接Section范围</label><input type="text" value={section} onChange={e=>setSection(e.target.value)} placeholder="选填" /></div>
          <div className="form-group"><label>服务单号</label><input aria-label="服务单号" type="text" value={serviceOrderNo} onChange={e=>setServiceOrderNo(e.target.value)} placeholder="选填" /></div>
          <div className="form-group"><label>订单号</label><input aria-label="订单号" type="text" value={orderNo} onChange={e=>setOrderNo(e.target.value)} placeholder="选填" /></div>
          <div className="form-group"><label>Canvas ID</label><input aria-label="Canvas ID" type="text" value={canvasId} onChange={e=>setCanvasId(e.target.value)} placeholder="选填" /></div>
          <div className="form-group"><label>底稿数规模</label><input type="text" value={papers} onChange={e=>setPapers(e.target.value)} placeholder="选填" /></div>
          <div className="form-group"><label>项目预算{project?.code?' (来自排班系统，只读)':''}</label><input type="text" value={budget} onChange={e=>setBudget(e.target.value)} disabled={!!project?.code} placeholder={project?.code?'自动同步':'选填'} style={project?.code?{background:"var(--surface-tint)",color:"var(--muted)"}:{}} /></div>
          <div className="form-group"><label>项目组EIC</label><input type="text" value={eic} onChange={e=>setEic(e.target.value)} placeholder="选填" /></div>
          <div className="form-group"><label>项目组FIC</label><PersonPicker label="项目组 FIC" value={teamFic} onChange={value=>{setTeamFic(value);setErr('');}} placeholder="搜索或选择 FIC（选填）" options={[{value:'',label:'未设置',utility:true},...STAFF_MASTER.filter(person=>BookingStaff.isFicName(person.name,STAFF_MASTER)).map(person=>personOption(person.name))]}/><small className="fic-picker-hint">masterdata 中的 Senior 或 Staff</small></div>
          {project?.code&&<small style={{gridColumn:'1 / -1',color:'var(--muted)',lineHeight:1.6}}>修改名称或 Code 会同步更新本项目的排班、预算、实际工时和 Task；Code 不能与其他项目重复或清空。</small>}
          {err && <div role="alert" style={{gridColumn:'1 / -1',color:'#DC2626',fontSize:'12px',fontWeight:600}}>{err}</div>}
          <div className="modal-actions" style={{gridColumn:'1 / -1'}}>
            {onDelete && <button className="glass-btn danger-btn" onClick={onDelete}>删除项目</button>}
            {onDelete && <div style={{flex:1}}></div>}
            <button className="glass-btn" onClick={onClose}>取消</button>
            <button className="glass-btn primary-btn" onClick={handleSave} disabled={!name.trim()||!fic.trim()}>保存</button>
          </div>
        </div>
      </div>
    </div>
  );
}


// ==================== NODE EDITOR MODAL ====================
function NodeEditorModal({ project, week, initialDate, editNode, onSave, onDelete, onClose }) {
  const range = getWeekRange(week);
  const isNew = !editNode;
  const [nodeDate, setNodeDate] = useState(editNode ? (editNode.date || editNode.week) : (initialDate || range.end));
  const [nodeName, setNodeName] = useState(editNode ? editNode.name : '');
  const [attention, setAttention] = useState(editNode?.attention || '');
  const [customName, setCustomName] = useState('');
  const [isCustom, setIsCustom] = useState(editNode ? (editNode.group === '自定义' || ![...(NODE_GROUPS['预审']||[]), ...(NODE_GROUPS['年审']||[])].includes(editNode.name)) : false);
  const [highlight, setHighlight] = useState(editNode ? (editNode.highlight || false) : false);

  const effectiveName = isCustom ? customName : nodeName;

  useEffect(() => { if (editNode && isCustom) setCustomName(editNode.name || ''); }, []);

  // Show which week the currently selected date falls into (for editing mode)
  const currentDateWeek = useMemo(() => {
    const d = parseWeekString(nodeDate);
    if (!d) return '';
    const fw = getFridayOfWeek(d).format('YYYY-MM-DD');
    const wr = getWeekRange(fw);
    return `${wr.start} ~ ${wr.end}`;
  }, [nodeDate]);

  const handleSave = () => {
    const name = isCustom ? customName.trim() : nodeName;
    if (!name) return;
    onSave({ name, date: nodeDate, attention:attention.trim(), group: isCustom ? '自定义' : getGroupLabel(name), highlight, completed: editNode ? editNode.completed : null, note: editNode ? editNode.note : '', delayed: editNode ? editNode.delayed : false, actualDate: editNode ? editNode.actualDate : '' });
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-wider glass-card" onClick={e => e.stopPropagation()}>
        <h3>{editNode ? '编辑节点' : '添加节点'} — {project?.name}</h3>
        <div className="node-form">
          <div className="form-group">
            <label>所属周</label>
            <input type="text" value={isNew ? `${range.start} (周六) ~ ${range.end} (周五)` : `原始: ${range.start} ~ ${range.end}`} disabled style={{background:"var(--surface-tint)",color:"var(--text)"}} />
          </div>
          <div className="form-group">
            <label>具体日期{isNew ? '（当周范围内）' : '（可修改至任意日期）'}</label>
            <input type="date" value={nodeDate}
              {...(isNew ? {min: range.start, max: range.end} : {})}
              onChange={e => setNodeDate(e.target.value)} />
            {!isNew && currentDateWeek && (
              <div className="week-range-hint">所选日期归属周: {currentDateWeek}</div>
            )}
          </div>
          <div className="form-group">
            <label>节点名称</label>
            <select value={isCustom ? '__custom__' : nodeName} onChange={e => {
              const v = e.target.value;
              if (v === '__custom__') { setIsCustom(true); setNodeName(''); } else { setIsCustom(false); setNodeName(v); setCustomName(''); }
            }}>
              <option value="">-- 请选择 --</option>
              <optgroup label="▸ 预审">{(NODE_GROUPS['预审']||[]).map(n => <option key={n} value={n}>{n}</option>)}</optgroup>
              <optgroup label="▸ 年审">{(NODE_GROUPS['年审']||[]).map(n => <option key={n} value={n}>{n}</option>)}</optgroup>
              <option value="__custom__">自定义...</option>
            </select>
          </div>
          {isCustom && (
            <div className="form-group">
              <label>自定义节点名称</label>
              <input type="text" value={customName} onChange={e => setCustomName(e.target.value)} placeholder="输入自定义节点名称..." autoFocus />
            </div>
          )}
          <div className="form-group">
            <label htmlFor="node-attention">节点注意事项（选填）</label>
            <textarea id="node-attention" aria-label="节点注意事项" value={attention} onChange={e=>setAttention(e.target.value)} rows={3} placeholder="填写本节点需留意的事项，留空则不显示叹号" style={{width:'100%',padding:'10px',border:'1px solid var(--line)',borderRadius:'6px',fontFamily:'inherit',resize:'vertical'}} />
          </div>
          <div className="form-group">
            <label style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer'}}>
              <input type="checkbox" checked={highlight} onChange={e => setHighlight(e.target.checked)}
                style={{width:'18px',height:'18px',cursor:'pointer',accentColor:'#DC2626'}} />
              <span style={{fontSize:'14px',color:"var(--text)"}}>是否高亮显示（红色字体）</span>
            </label>
          </div>
          <div className="modal-actions">
            {onDelete && <button className="glass-btn danger-btn" onClick={onDelete}>删除节点</button>}
            {onDelete && <div style={{flex:1}}></div>}
            <button className="glass-btn" onClick={onClose}>取消</button>
            <button className="glass-btn primary-btn" onClick={handleSave} disabled={!effectiveName.trim()}>确定</button>
          </div>
        </div>
      </div>
    </div>
  );
}


// ==================== STATUS MODAL ====================
function StatusModal({ project, node, onSave, onDelete, onClose }) {
  const [completed, setCompleted] = useState(node?.completed || null);
  const [note, setNote] = useState(node?.note || '');
  const [actualDate, setActualDate] = useState(node?.actualDate || '');
  if (!project || !node) return null;
  const d = dayjs(node.date || node.week);
  const range = getWeekRange(node.week);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e => e.stopPropagation()}>
        <h3>节点完成情况</h3>
        <div className="node-form">
          <div className="form-group"><label>项目</label><input type="text" value={project.name} disabled style={{background:"var(--surface-tint)",color:"var(--text)"}} /></div>
          <div className="form-group"><label>节点</label><input type="text" value={node.name} disabled style={{background:"var(--surface-tint)",color:"var(--text)"}} /></div>
          <div className="form-group"><label>具体日期</label><input type="text" value={`${node.date} (${d.format('MM/DD')}) · ${range.start}~${range.end}`} disabled style={{background:"var(--surface-tint)",color:"var(--text)"}} /></div>
          <div className="form-group">
            <label>完成状态</label>
            <div className="radio-group">
              <label className="radio-option"><input type="radio" name="status" checked={completed==='Y'} onChange={()=>{setCompleted('Y');}} /><span style={{color:'#16A34A',fontWeight:600}}>Y 已完成</span></label>
              <label className="radio-option"><input type="radio" name="status" checked={completed==='N'} onChange={()=>setCompleted('N')} /><span style={{color:'#DC2626',fontWeight:600}}>N 未完成/逾期</span></label>
              <label className="radio-option"><input type="radio" name="status" checked={completed===null} onChange={()=>{setCompleted(null);}} /><span style={{color:"var(--muted)"}}>待确认</span></label>
            </div>
          </div>
          {(
            <div className="form-group"><label>实际进展 / 逾期理由 {completed==='N'&&<span style={{color:'#DC2626'}}>*</span>}</label>
            <textarea aria-label="节点实际进展" value={note} onChange={e=>setNote(e.target.value)} placeholder="记录节点实际进展、沟通情况或逾期原因..." /></div>
          )}
          {(completed==='Y' || node.completed==='N') && (
            <div className="form-group">
              <label>实际完成日期</label>
              <input type="date" value={actualDate} onChange={e => setActualDate(e.target.value)} />
            </div>
          )}
          <div className="modal-actions">
            <button className="glass-btn danger-btn" onClick={onDelete}>删除节点</button>
            <div style={{flex:1}}></div>
            <button className="glass-btn" onClick={onClose}>取消</button>
            <button className="glass-btn primary-btn" onClick={()=>onSave(completed, note, actualDate)} disabled={completed==='N'&&!note.trim()}>确定</button>
          </div>
        </div>
      </div>
    </div>
  );
}


// ==================== OVERDUE SUMMARY ====================
function NoteTextarea({value,onCommit,style,placeholder}){
  const [v,setV]=useState(value);
  useEffect(()=>{setV(value);},[value]);
  return <textarea value={v} onChange={e=>setV(e.target.value)} onBlur={()=>{if(v!==value)onCommit(v);}} style={style} placeholder={placeholder}/>;
}

function OverdueApp({ projects, updateProjects, onBack }) {
  const overdueNodes = useMemo(() => {
    const items = [];
    projects.forEach(p => {
      p.nodes.filter(n => isNodeOverdue(n) || n.delayed).forEach(n => {
        items.push({ ...n, projectId: p.id, projectName: p.name, fic: p.fic || '', code: p.code || '' });
      });
    });
    return items;
  }, [projects]);

  const [ovProjFilter, setOvProjFilter] = useState(new Set());
  const [ovProjOpen, setOvProjOpen] = useState(false);
  const ovProjRef = useRef(null);
  const [ovFicFilter, setOvFicFilter] = useState(new Set());
  const [ovFicOpen, setOvFicOpen] = useState(false);
  const ovFicRef = useRef(null);

  useEffect(() => {
    if (!ovProjOpen) return;
    const h = (e) => { if (ovProjRef.current && !ovProjRef.current.contains(e.target)) setOvProjOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [ovProjOpen]);
  useEffect(() => {
    if (!ovFicOpen) return;
    const h = (e) => { if (ovFicRef.current && !ovFicRef.current.contains(e.target)) setOvFicOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [ovFicOpen]);

  const ovAllFics = useMemo(() => {
    const fics = new Set();
    overdueNodes.forEach(n => { if (n.fic) fics.add(n.fic); });
    return Array.from(fics).sort();
  }, [overdueNodes]);

  const visibleOverdue = useMemo(() => {
    let result = overdueNodes;
    if (ovProjFilter.size > 0) result = result.filter(n => ovProjFilter.has(n.projectId));
    if (ovFicFilter.size > 0) result = result.filter(n => ovFicFilter.has(n.fic));
    return result;
  }, [overdueNodes, ovProjFilter, ovFicFilter]);

  const handleUpdate = useCallback((projectId, nodeId, updates) => {
    updateProjects(projects.map(p => {
      if (p.id !== projectId) return p;
      return { ...p, nodes: p.nodes.map(n => n.id === nodeId ? { ...n, ...updates } : n) };
    }));
  }, [projects, updateProjects]);

  const handleMarkComplete = useCallback((projectId, nodeId, item) => {
    const today = dayjs().format('YYYY-MM-DD');
    updateProjects(projects.map(p => {
      if (p.id !== projectId) return p;
      return { ...p, nodes: p.nodes.map(n => {
        if (n.id !== nodeId) return n;
        return { ...n, completed: 'Y', delayed: true, actualDate: n.actualDate || today, note: n.note };
      })};
    }));
  }, [projects, updateProjects]);

  const handleNoteChange = useCallback((projectId, nodeId, note) => {
    updateProjects(projects.map(p => {
      if (p.id !== projectId) return p;
      return { ...p, nodes: p.nodes.map(n => n.id === nodeId ? { ...n, note } : n) };
    }));
  }, [projects, updateProjects]);

  const handleDateChange = useCallback((projectId, nodeId, actualDate) => {
    updateProjects(projects.map(p => {
      if (p.id !== projectId) return p;
      return { ...p, nodes: p.nodes.map(n => n.id === nodeId ? { ...n, actualDate } : n) };
    }));
  }, [projects, updateProjects]);

  if (projects.length === 0) {
    return (
      <div className="sub-app overdue-app">
        <WorkspaceHeader section="项目节点管理" backLabel="返回时间表" onBack={onBack}/><div className="timeline-heading"><PageHeading title="逾期汇总" label="DELIVERY FOLLOW-UP"/></div>
        <div className="empty-state">暂无项目数据</div>
      </div>
    );
  }

  return (
    <div className="sub-app overdue-app">
        <WorkspaceHeader section="项目节点管理" backLabel="返回时间表" onBack={onBack}/>
        <div className="timeline-heading"><PageHeading title="逾期汇总" label="DELIVERY FOLLOW-UP" detail="跟进未完成节点与延期交付"/></div>
        <div className="overdue-toolbar">
          <div className="fy-multi-wrap" ref={ovProjRef}>
            <button className="fy-trigger" onClick={() => setOvProjOpen(prev => !prev)} style={{minWidth:'110px'}}>
              {ovProjFilter.size > 0 ? `项目 (${ovProjFilter.size})` : '全部项目'}
              <span className="arrow">▼</span>
            </button>
            {ovProjOpen && (
              <>
                <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:998}} onClick={() => setOvProjOpen(false)}></div>
                <div className="fy-dropdown" onClick={e => e.stopPropagation()}>
                  {projects.map(p => (
                    <label key={p.id} className={`fy-dropdown-item${ovProjFilter.has(p.id) ? ' checked' : ''}`}>
                      <input type="checkbox" checked={ovProjFilter.has(p.id)} onChange={() => setOvProjFilter(prev=>{const n=new Set(prev);if(n.has(p.id))n.delete(p.id);else n.add(p.id);return n;})} />
                      {p.name}
                    </label>
                  ))}
                  <div className="fy-dropdown-foot">
                    {ovProjFilter.size > 0 && <button className="glass-btn small-btn" onClick={()=>setOvProjFilter(new Set())} style={{padding:'5px 10px',fontSize:'11px'}}>清除</button>}
                  </div>
                </div>
              </>
            )}
          </div>
          <div className="fy-multi-wrap" ref={ovFicRef}>
            <button className="fy-trigger" onClick={() => setOvFicOpen(prev => !prev)} style={{minWidth:'110px'}}>
              {ovFicFilter.size > 0 ? `FIC (${ovFicFilter.size})` : '全部FIC'}
              <span className="arrow">▼</span>
            </button>
            {ovFicOpen && (
              <>
                <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:998}} onClick={() => setOvFicOpen(false)}></div>
                <div className="fy-dropdown" onClick={e => e.stopPropagation()}>
                  <PersonSearchList names={ovAllFics} selected={ovFicFilter} onToggle={f=>setOvFicFilter(prev=>{const n=new Set(prev);if(n.has(f))n.delete(f);else n.add(f);return n;})} label="搜索逾期 FIC" emptyText="暂无FIC" rowClassName="fy-dropdown-item"/>
                  <div className="fy-dropdown-foot">
                    {ovFicFilter.size > 0 && <button className="glass-btn small-btn" onClick={()=>setOvFicFilter(new Set())} style={{padding:'5px 10px',fontSize:'11px'}}>清除</button>}
                  </div>
                </div>
              </>
            )}
          </div>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'12px'}}>
          {visibleOverdue.length > 0 && (
            <button className="glass-btn nav-btn" onClick={() => {
              const data = [['Engagement Name','FIC','Engagement Code','Section','底稿数规模','项目预算','项目组EIC','项目组FIC','节点名称','计划日期','进度说明/逾期理由','实际完成日期','状态','服务单号','订单号','Canvas ID']];
              visibleOverdue.forEach(item => {
                const proj = projects.find(p => p.id === item.projectId);
                data.push([item.projectName, item.fic||'', proj?.code||'', proj?.section||'', proj?.papers||'', proj?.budget||'', proj?.eic||'', proj?.teamFic||'', item.name, item.date || item.week, item.note || '', item.actualDate || '', item.delayed ? '已完成(延迟)' : '未完成',proj?.serviceOrderNo||'',proj?.orderNo||'',proj?.canvasId||'']);
              });
              const ws = XLSX.utils.aoa_to_sheet(data);
              ws['!cols'] = [{wch:24},{wch:16},{wch:14},{wch:14},{wch:12},{wch:14},{wch:16},{wch:16},{wch:18},{wch:14},{wch:40},{wch:14},{wch:16},{wch:24},{wch:24}];
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, '逾期汇总');
              XLSX.writeFile(wb, `逾期汇总_${dayjs().format('YYYY-MM-DD')}.xlsx`);
            }}><UIIcon name="download"/> 导出Excel</button>
          )}
          <span style={{fontSize:'13px',color:"var(--muted)",fontFamily:"var(--font)"}}>
            {visibleOverdue.length > 0
              ? `共 ${visibleOverdue.length} 项（未完成: ${visibleOverdue.filter(n=>!n.delayed).length} 已完成: ${visibleOverdue.filter(n=>n.delayed).length}）`
              : '无逾期项 ✓'}
          </span>

        </div>
      </div>
      <div className="sub-content overdue-content">
        {visibleOverdue.length === 0 ? (
          <div className="empty-state">所有节点均已完成，无逾期项</div>
        ) : (
          <div className="timeline-grid-scroll" style={{margin:0}}>
            <table className="overdue-grid" style={{width:'100%',borderCollapse:'separate',borderSpacing:0,fontSize:'13px'}}>
              <thead>
                <tr>
                  <th style={{position:'sticky',top:0,zIndex:10,background:'var(--dark)',color:'#FFFFFF',padding:'8px 12px',textAlign:'left',fontWeight:600,fontSize:'12px',borderBottom:'1px solid rgba(0,0,0,0.15)'}}>项目</th>
                  <th style={{position:'sticky',top:0,zIndex:10,background:'var(--dark)',color:'#FFFFFF',padding:'8px 12px',textAlign:'left',fontWeight:600,fontSize:'12px',borderBottom:'1px solid rgba(0,0,0,0.15)',width:'110px'}}>FIC</th>
                  <th style={{position:'sticky',top:0,zIndex:10,background:'var(--dark)',color:'#FFFFFF',padding:'8px 12px',textAlign:'left',fontWeight:600,fontSize:'12px',borderBottom:'1px solid rgba(0,0,0,0.15)'}}>节点</th>
                  <th style={{position:'sticky',top:0,zIndex:10,background:'var(--dark)',color:'#FFFFFF',padding:'8px 12px',textAlign:'center',fontWeight:600,fontSize:'12px',borderBottom:'1px solid rgba(0,0,0,0.15)',width:'100px'}}>计划日期</th>
                  <th style={{position:'sticky',top:0,zIndex:10,background:'var(--dark)',color:'#FFFFFF',padding:'8px 12px',textAlign:'left',fontWeight:600,fontSize:'12px',borderBottom:'1px solid rgba(0,0,0,0.15)'}}>进度说明 / 逾期理由</th>
                  <th style={{position:'sticky',top:0,zIndex:10,background:'var(--dark)',color:'#FFFFFF',padding:'8px 12px',textAlign:'center',fontWeight:600,fontSize:'12px',borderBottom:'1px solid rgba(0,0,0,0.15)',width:'110px'}}>实际完成日期</th>
                  <th style={{position:'sticky',top:0,zIndex:10,background:'var(--dark)',color:'#FFFFFF',padding:'8px 12px',textAlign:'center',fontWeight:600,fontSize:'12px',borderBottom:'1px solid rgba(0,0,0,0.15)',width:'80px'}}>操作</th>
                </tr>
              </thead>
              <tbody>
                {visibleOverdue.map((item, i) => {
                  const color = getProjectColor(item.code || item.projectId);
                  const isDone = item.delayed && item.completed === 'Y';
                  return (
                    <tr key={item.id} style={{borderBottom:"1px solid var(--line)",opacity:isDone?0.7:1}}>
                      <td style={{padding:'8px 12px',background:isDone?"var(--surface-tint)":'#FFFFFF'}}>
                        <span className="project-color-strip" style={{backgroundColor:color}}></span>
                        {item.projectName}
                      </td>
                      <td style={{padding:'8px 12px',background:isDone?"var(--surface-tint)":'#FFFFFF',fontSize:'12px',color:"var(--text)",fontWeight:500}}>{item.fic || ''}</td>
                      <td style={{padding:'8px 12px',background:isDone?"var(--surface-tint)":'#FFFFFF',fontWeight:500,textDecoration:isDone?'line-through':'none'}}>{item.name}</td>

                      <td style={{padding:'6px 12px',background:isDone?"var(--surface-tint)":'#FFFFFF'}}>
                        <NoteTextarea value={item.note || ''}
                          onCommit={v => handleNoteChange(item.projectId, item.id, v)}
                          style={{width:'100%',border:"1px solid var(--line)",borderRadius:'6px',padding:'6px 10px',fontSize:'12px',fontFamily:"var(--font)",outline:'none',resize:'vertical',minHeight:'32px',background:'#FFF'}}
                          placeholder="点击填写进度说明..." />
                      </td>
                      <td style={{padding:'8px 12px',background:isDone?"var(--surface-tint)":'#FFFFFF',textAlign:'center'}}>
                        {isDone ? (
                          <span style={{color:'#16A34A',fontWeight:600,fontSize:'12px'}}>{item.actualDate || '—'}</span>
                        ) : (
                          <input type="date" value={item.actualDate || ''}
                            onChange={e => handleDateChange(item.projectId, item.id, e.target.value)}
                            style={{border:"1px solid var(--line)",borderRadius:'6px',padding:'4px 8px',fontSize:'12px',fontFamily:"var(--font)",outline:'none',width:'100px'}} />
                        )}
                      </td>
                      <td style={{padding:'8px 12px',background:isDone?"var(--surface-tint)":'#FFFFFF',textAlign:'center'}}>
                        {isDone ? (
                          <span className="status-badge done" style={{display:'inline-block'}}>Y⌛</span>
                        ) : (
                          <button className="glass-btn primary-btn small-btn" style={{fontSize:'11px',padding:'5px 10px'}}
                            onClick={() => handleMarkComplete(item.projectId, item.id, item)}>
                            标记完成
                          </button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}



// ==================== PRINT MODAL ====================
function buildTimelinePrintHtml(selectedWeeks, projects, clearMode, today) {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Give each node a real column; split long ranges rather than wrapping independent rows.
  const bands=[];let band=[],width=180;
  selectedWeeks.forEach(w=>{
    const slots=Math.max(1,...projects.map(p=>p.nodes.filter(n=>n.week===w.week).length));
    const item={...w,width:slots*72+8};
    if(band.length && width+item.width>1000){bands.push(band);band=[];width=180;}
    band.push(item);width+=item.width;
  });
  if(band.length)bands.push(band);
  const sections=bands.map((weeks,index)=>{
    const head=weeks.map(w=>`<th>${esc(w.label)}<div class="phase">${w.phase==='pre'?'预审':'年审'}</div></th>`).join('');
    const rows=projects.map(project=>{
      const color=getProjectColor(project.code||project.id);
      const cells=weeks.map(w=>{
        const nodes=project.nodes.filter(n=>n.week===w.week).sort((a,b)=>String(a.date||a.week).localeCompare(String(b.date||b.week)));
        if(!nodes.length)return '<td class="empty">—</td>';
        const columns=nodes.map(n=>`<td class="print-node" style="color:${n.highlight?'#DC2626':'#333'}"><div class="print-date" style="background:${color}22">${dayjs(n.date||n.week).format('YY/MM/DD')}</div><div class="print-name">${esc(n.name)}</div><div class="print-status" style="color:${n.completed==='Y'?'#16803a':n.completed==='N'?'#DC2626':'#999'}">${clearMode?'&nbsp;':n.completed==='Y'?(n.delayed?'Y⌛':'Y'):n.completed==='N'?'N':'—'}</div></td>`).join('');
        return `<td class="week-cell"><table class="node-table"><tbody><tr>${columns}</tr></tbody></table></td>`;
      }).join('');
      return `<tr class="project-row"><td class="project-name"><strong>${esc(project.name)}</strong><div>FIC: ${esc(project.fic||'请补充')}</div></td>${cells}</tr>`;
    }).join('');
    return `<section><h2>项目时间表</h2><div class="info">打印日期: ${esc(today)} | 范围: ${esc(weeks[0].label)} ~ ${esc(weeks[weeks.length-1].label)} | 项目数: ${projects.length} | 分段: ${index+1}/${bands.length}</div><table class="timeline-print"><colgroup><col style="width:180px">${weeks.map(w=>`<col style="width:${w.width}px">`).join('')}</colgroup><thead><tr><th>项目名称</th>${head}</tr></thead><tbody>${rows}</tbody></table></section>`;
  }).join('');
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>项目时间表 ${esc(today)}</title><style>
  @page{size:A4 landscape;margin:10mm}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;color:#333}
  section+section{break-before:page;page-break-before:always}h2{font-size:16px;margin:0 0 8px}.info{font-size:11px;margin-bottom:8px}
  .timeline-print{border-collapse:collapse;table-layout:fixed;width:100%}
  .timeline-print>thead{display:table-header-group}.timeline-print>thead th{background:#111827;color:#fff;border:1px solid #ddd;padding:8px 2px;font-size:11px;white-space:nowrap}
  .phase{font-size:9px;margin-top:3px}.project-row{break-inside:avoid;page-break-inside:avoid}
  .project-row>td{border:1px solid #ddd;vertical-align:top}.project-name{padding:8px;font-size:12px;overflow-wrap:anywhere}.project-name div{font-size:10px;margin-top:5px}
  .week-cell{padding:0}.empty{text-align:center;color:#aaa}.node-table{border-collapse:collapse;table-layout:fixed;width:100%}
  .node-table tbody{display:table-row-group}.node-table tr{break-inside:avoid;page-break-inside:avoid}
  .print-node{padding:0;text-align:center;vertical-align:top;font-size:10px;border:0}
  .print-date{white-space:nowrap;font-weight:600;padding:6px 1px}.print-name{padding:6px 2px 3px;overflow-wrap:anywhere}.print-status{padding:3px 2px 6px;font-weight:700}
  </style></head><body>${sections}</body></html>`;
}

function PrintModal({ weekLabels, visibleProjects, columnWidths, onClose }) {
  const [startIdx, setStartIdx] = useState(0);
  const [endIdx, setEndIdx] = useState(Math.min(weekLabels.length - 1, 11));
  const [printMode, setPrintMode] = useState('keep');

  const handlePrint = () => {
    const selectedWeeks = weekLabels.slice(startIdx, endIdx + 1);
    const today = dayjs().format('YYYY-MM-DD');
    const clearMode = printMode === 'clear';

    const html = buildTimelinePrintHtml(selectedWeeks, visibleProjects, clearMode, today);

    const printWindow = window.open('', '_blank');
    if (!printWindow) { alert('浏览器拦截了弹出窗口，请允许弹出窗口后重试'); return; }
    printWindow.document.write(html);
    printWindow.document.close();
    setTimeout(() => { printWindow.print(); }, 500);
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e => e.stopPropagation()} style={{maxWidth:'480px'}}>
        <h3>打印时间表</h3>
        <div className="node-form">
          <div className="form-group">
            <label>开始周</label>
            <select value={startIdx} onChange={e => setStartIdx(parseInt(e.target.value))}>
              {weekLabels.map((w, i) => <option key={i} value={i}>{w.label} ({w.phase==='pre'?'预审':'年审'})</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>结束周</label>
            <select value={endIdx} onChange={e => setEndIdx(parseInt(e.target.value))}>
              {weekLabels.map((w, i) => <option key={i} value={i} disabled={i < startIdx}>{w.label} ({w.phase==='pre'?'预审':'年审'})</option>)}
            </select>
          </div>
          <div style={{fontSize:'12px',color:"var(--muted)",padding:'4px 0'}}>
            共 {endIdx - startIdx + 1} 周，{visibleProjects.length} 个项目；较长期间按纸张宽度分段打印。
          </div>
          <div className="form-group">
            <label>打印模式</label>
            <div className="radio-group">
              <label className="radio-option"><input type="radio" name="printMode" checked={printMode==='keep'} onChange={()=>setPrintMode('keep')} /><span>保留状态</span></label>
              <label className="radio-option"><input type="radio" name="printMode" checked={printMode==='clear'} onChange={()=>setPrintMode('clear')} /><span>清空状态（不显示Y/N，手工填写）</span></label>
            </div>
          </div>
          <div className="modal-actions">
            <button className="glass-btn" onClick={onClose}>取消</button>
            <button className="glass-btn primary-btn" onClick={handlePrint} disabled={endIdx < startIdx}>🖨️ 打印</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ==================== RENDER ====================
ReactDOM.render(<App />, document.getElementById('root'));
</script>
