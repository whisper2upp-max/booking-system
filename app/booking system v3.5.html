    </div>
  );
}

// ==================== MANUAL BOOKING MODAL ====================
function ManualBookingModal({data,allProjects,weeks,onClose,onAdd,initialProject,initialWeek}){
  const existingNames=useMemo(()=>Array.from(new Set([...data.map(e=>e.name),...STAFF_MASTER.map(person=>person.name)])).sort(),[data]);
  const existingLevels=useMemo(()=>{
    const m=new Map();
    data.forEach(e=>{if(!m.has(e.name))m.set(e.name,e.level);});
    return m;
  },[data]);
  const existingEICs=useMemo(()=>{
    const m=new Map();
    data.forEach(e=>{if(!m.has(e.name))m.set(e.name,e.eic);});
    return m;
  },[data]);

  const [name,setName]=useState('');
  const [isNameNew,setIsNameNew]=useState(false);
  const [level,setLevel]=useState('Senior');
  const [eic,setEic]=useState('');
  const [code,setCode]=useState(initialProject?.code||'');
  const [ename,setEname]=useState(initialProject?.name||'');
  const [isCodeNew,setIsCodeNew]=useState(false);
  const [startWeek,setStartWeek]=useState(initialWeek||(weeks.length>0?weeks[0].fridayDate:''));
  const [endWeek,setEndWeek]=useState(initialWeek||(weeks.length>0?weeks[Math.min(weeks.length-1,11)].fridayDate:''));
  const [totalHrs,setTotalHrs]=useState(40);
  const [err,setErr]=useState('');

  const handleNameSelect=(v)=>{
    if(v==='__new__'){setIsNameNew(true);setName('');setLevel('Senior');setEic('');return;}
    setIsNameNew(false);setName(v);
    if(existingLevels.has(v))setLevel(existingLevels.get(v));
    if(existingEICs.has(v))setEic(existingEICs.get(v));
    const staff=resolveBookingStaff(v);
    if(staff){setLevel(staff.level);setEic(staff.eic);}
  };

  const handleCodeSelect=(v)=>{
    if(v==='__new__'){setIsCodeNew(true);setCode('');setEname('');return;}
    setIsCodeNew(false);setCode(v);setEname(allProjects.find(p=>p.code===v)?.name||'');
  };

  const handleConfirm=()=>{
    setErr('');
    if(!name.trim()||!BookingStaff.isBookingName(name.trim())){setErr('正式姓名须以英文点号分隔；待入职人员可使用中文名');return;}
    if(isNameNew&&!eic.trim()){setErr('新增姓名时EIC为必填项');return;}
    if(isNameNew&&eic.trim()&&!NAME_PATTERN.test(eic.trim())){setErr('EIC格式不正确（须为英文.连接，如 First.Last）');return;}
    if(!code.trim()){setErr('请选择或输入 Engagement Code');return;}
    if(!ename.trim()){setErr('请填写 Engagement Name');return;}
    if(!totalHrs||totalHrs<=0){setErr('排班总Hrs必须大于0');return;}

    const wkList=[];
    for(let i=0;i<weeks.length;i++){
      const w=weeks[i];
      if(w.fridayDate>=startWeek&&w.fridayDate<=endWeek)wkList.push(w);
    }
    if(wkList.length===0){setErr('开始周到结束周范围内无有效周');return;}

    const hrsPerWeek=Math.max(0.5,Math.round((totalHrs/wkList.length)*2)/2); // round to 0.5, min 0.5
    const entries=[];
    wkList.forEach(w=>{
      entries.push({
        engagementCode:code,engagementName:ename,name:normalizeName(name),level,
        week:w.fridayDate,hrs:Math.min(hrsPerWeek,168),eic:eic||''
      });
    });
    try{onAdd(entries);onClose();}catch(error){setErr(error.message||'保存失败，请检查本地存储后重试。');}
  };

  const startIdx=weeks.findIndex(w=>w.fridayDate===startWeek);
  const endIdx=weeks.findIndex(w=>w.fridayDate===endWeek);
  const wkCount=startIdx>=0&&endIdx>=startIdx?endIdx-startIdx+1:0;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e=>e.stopPropagation()} style={{maxWidth:'620px'}}>
        <h3>手动排班</h3>
        <div className="edit-form manual-booking-form">
          <div className="form-group">
            <label>姓名（可搜索或下拉选择）</label>
            <PersonPicker label="排班人员" value={isNameNew?'__new__':name} onChange={handleNameSelect}
              options={[{value:'',label:'请选择人员',utility:true},...existingNames.map(personOption),{value:'__new__',label:'手动输入新姓名…',utility:true}]}/>
            {isNameNew&&<input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="格式：Example.Person" autoFocus style={{marginTop:'6px'}}/>}
          </div>
          <div className="manual-field-stack">
            {isNameNew?<>
              <div className="form-group"><label>Level</label><select value={level} onChange={e=>setLevel(e.target.value)}>
                <option value="Manager">Manager</option><option value="Senior">Senior</option><option value="Staff">Staff</option><option value="Intern">Intern</option>
              </select></div>
              <div className="form-group"><label>EIC</label><input type="text" value={eic} onChange={e=>setEic(e.target.value)} placeholder="格式：First.Last"/></div>
            </>:<div className="form-group"><label>Level</label><input type="text" value={level} disabled style={{background:"var(--surface-tint)",color:"var(--muted)"}}/></div>}
          </div>
          <div className="form-group">
            <label>Engagement Code（可选已有/预算项目，可新增）</label>
            <select value={isCodeNew?'__new__':code} onChange={e=>handleCodeSelect(e.target.value)}>
              <option value="">-- 请选择 --</option>
              {allProjects.map(p=><option key={p.code} value={p.code}>{p.code} - {p.name}</option>)}
              <option value="__new__">手动输入新Code...</option>
            </select>
            {isCodeNew&&<input type="text" value={code} onChange={e=>setCode(e.target.value)} placeholder="输入新 Engagement Code" autoFocus style={{marginTop:'6px'}}/>}
          </div>
          <div className="form-group"><label>Engagement Name</label><input type="text" value={ename} onChange={e=>setEname(e.target.value)} placeholder="项目名称"/></div>
          <div className="form-group"><label>开始周</label><select value={startWeek} onChange={e=>setStartWeek(e.target.value)}>{weeks.map(w=><option key={w.fridayDate} value={w.fridayDate}>{w.label}</option>)}</select></div>
          <div className="form-group"><label>结束周</label><select value={endWeek} onChange={e=>setEndWeek(e.target.value)}>{weeks.map((w,i)=><option key={w.fridayDate} value={w.fridayDate} disabled={i<startIdx}>{w.label}</option>)}</select></div>
          <div className="form-group"><label>排班总Hrs</label><input type="number" value={totalHrs} onChange={e=>setTotalHrs(Number(e.target.value))} min={0.5} max={9999} step={0.5}/></div>
          <div className="manual-week-summary">{wkCount>0?`共 ${wkCount} 周，每约 ${(totalHrs/wkCount).toFixed(1)} hrs`:'请选择有效周范围'}</div>
          {err&&<div style={{gridColumn:'1 / -1',color:'#DC2626',fontSize:'12px',fontWeight:600}}>{err}</div>}
        </div>
        <div className="modal-actions">
          <button className="glass-btn" onClick={onClose}>取消</button>
          <button className="glass-btn primary-btn" onClick={handleConfirm}>确定排班</button>
        </div>
      </div>
    </div>
  );
}

// ==================== BATCH DELETE MODAL ====================
function BatchDeleteModal({data,onClose,onDelete}){
  const persons=useMemo(()=>Array.from(new Set(data.map(e=>e.name))).sort((a,b)=>a.localeCompare(b)),[data]);
  const projects=useMemo(()=>{const m=new Map();data.forEach(e=>m.set(e.engagementCode,e.engagementName));return Array.from(m.entries()).sort((a,b)=>a[0].localeCompare(b[0]));},[data]);
  const weeks=useMemo(()=>Array.from(new Set(data.map(e=>e.week))).sort(),[data]);

  const [selectedPersons,setSelectedPersons]=useState(new Set());
  const [selectedProjects,setSelectedProjects]=useState(new Set());
  const [selectedWeeks,setSelectedWeeks]=useState(new Set());
  const [showConfirm,setShowConfirm]=useState(false);

  const toggle=(set,value)=>{const next=new Set(set);if(next.has(value))next.delete(value);else next.add(value);return next;};
  const toggleAll=(all,current,setter)=>{if(current.size===all.length)setter(new Set());else setter(new Set(all));};

  const matching=useMemo(()=>data.filter(e=>selectedPersons.has(e.name)&&selectedProjects.has(e.engagementCode)&&selectedWeeks.has(e.week)),[data,selectedPersons,selectedProjects,selectedWeeks]);

  const handleDelete=()=>{if(matching.length===0)return;setShowConfirm(true);};
  const doDelete=()=>{
    const toRemove=new Set(matching.map(e=>`${e.name}|${e.week}|${e.engagementCode}`));
    const remaining=data.filter(e=>!toRemove.has(`${e.name}|${e.week}|${e.engagementCode}`));
    onDelete(remaining);setShowConfirm(false);onClose();
  };

  const renderColumn=(title,items,selected,setter,renderLabel)=>{
    const allValues=items.map(item=>Array.isArray(item)?item[0]:item);
    return (
      <div className="batch-delete-column">
        <div className="batch-delete-col-header">
          <label className="checkbox-all">
            <input type="checkbox" checked={allValues.length>0&&selected.size===allValues.length} onChange={()=>toggleAll(allValues,selected,setter)}/>
            <span>{title}（全选）</span>
          </label>
        </div>
        <div className="batch-delete-col-body">
          {title==='人'?<PersonSearchList names={items} selected={selected} onToggle={value=>setter(toggle(selected,value))} label="搜索待删除人员" rowClassName="checkbox-item"/>:items.map(item=>{
            const value=Array.isArray(item)?item[0]:item;
            const label=renderLabel?renderLabel(item):value;
            return <label key={value} className="checkbox-item"><input type="checkbox" checked={selected.has(value)} onChange={()=>setter(toggle(selected,value))}/><span>{label}</span></label>;
          })}
        </div>
      </div>
    );
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card batch-delete-modal" onClick={e=>e.stopPropagation()}>
        {!showConfirm?(
          <>
            <h3>批量删除排班</h3>
            <p className="batch-delete-tip">请选择要删除的人、项目、周，系统将删除同时满足三个条件的数据。</p>
            <div className="batch-delete-columns">
              {renderColumn('人',persons,selectedPersons,setSelectedPersons)}
              {renderColumn('项目',projects,selectedProjects,setSelectedProjects,item=>`${item[0]} - ${item[1]}`)}
              {renderColumn('Week',weeks,selectedWeeks,setSelectedWeeks)}
            </div>
            <div className="batch-delete-summary">已匹配 <strong>{matching.length}</strong> 条待删除记录</div>
            <div className="modal-actions">
              <button className="glass-btn" onClick={onClose}>取消</button>
              <button className="glass-btn danger-btn" onClick={handleDelete} disabled={matching.length===0}>删除 {matching.length} 条</button>
            </div>
          </>
        ):(
          <>
            <h3>确认删除</h3>
            <p className="batch-delete-tip">确定要删除 <strong>{matching.length}</strong> 条排班记录吗？此操作不可恢复。</p>
            <div className="modal-actions">
              <button className="glass-btn" onClick={()=>setShowConfirm(false)}>取消</button>
              <button className="glass-btn danger-btn" onClick={doDelete}>确认删除</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ==================== WEEK LOCATOR ====================
function WeekLocator({weeks,value,onChange,onGo,onClose}){
  const sorted=useMemo(()=>[...weeks].sort((a,b)=>a.fridayDate.localeCompare(b.fridayDate)),[weeks]);
  const groups=useMemo(()=>{
    const g=new Map();
    sorted.forEach(w=>{const fy=w.label.split(' ')[0];if(!g.has(fy))g.set(fy,[]);g.get(fy).push(w);});
    return Array.from(g.entries());
  },[sorted]);
  const selectRef=useRef(null);

  const handleGo=()=>{
    const v=selectRef.current?selectRef.current.value:value;
    if(v)onGo(v);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e=>e.stopPropagation()} style={{minWidth:300,maxWidth:360}}>
        <h3><UIIcon name="locate"/> 定位周</h3>
        <div className="edit-form">
          <div className="form-group"><label>选择目标周</label>
            <select ref={selectRef} value={value} onChange={e=>onChange(e.target.value)} size={Math.min(12,sorted.length)} style={{height:'auto',overflow:'auto'}}>
              <option value="" disabled>-- 请选择周 --</option>
              {groups.map(([fy,fws])=><optgroup key={fy} label={fy}>
                {fws.map(w=><option key={w.fridayDate} value={w.fridayDate}>{w.label.replace(' ',' ')} ({w.availableHrs}h)</option>)}
              </optgroup>)}
            </select>
          </div>
        </div>
        <div className="modal-actions">
          <button className="glass-btn" onClick={onClose}>取消</button>
          <button className="glass-btn primary-btn" onClick={handleGo}>定位</button>
        </div>
      </div>
    </div>
  );
}

// ==================== EXPORT MODAL ====================
function ExportModal({data,onClose,mode='eic'}){
  const uniqueEics=useMemo(()=>[...new Set(data.map(e=>e.eic))].filter(Boolean).sort(),[data]);
  const [eic,setEic]=useState(uniqueEics[0]||'');
  const [fy,setFy]=useState('');
  const [start,setStart]=useState('');
  const [end,setEnd]=useState('');
  const [exportFormat,setExportFormat]=useState('booking');
  const isOu=mode==='ou';

  const availableFYs=useMemo(()=>{const s=new Set();data.forEach(e=>{if(e.week)s.add(getFiscalYear(dayjs(e.week)));});return [...s].sort();},[data]);

  // Default to the latest FY present in data; fall back to current FY when empty
  useEffect(()=>{if(availableFYs.length>0&&!availableFYs.includes(fy))setFy(availableFYs[availableFYs.length-1]);},[availableFYs,fy]);

  const doExport=()=>{
    let s=start,e=end;
    if(!s||!e){
      const fyNum=parseInt((fy||getCurrentFY()).replace('FY',''),10);const fy20=2000+fyNum;
      s=`${fy20-1}-07-01`;e=`${fy20}-06-30`;
    }
    if(exportFormat==='report'){exportReport(data,s,e);}
    else if(exportFormat==='booking'){
      if(isOu)exportAllCSV(data,s,e);
      else exportCSV(data,eic,s,e);
    }else{
      exportSGFormat(data,eic,s,e,isOu);
    }
    onClose();
  };

  const exportReport=(data,startWeek,endWeek)=>{
    const filtered=data.filter(e=>e.week>=startWeek&&e.week<=endWeek);
    const weeks=[...new Set(filtered.map(e=>e.week))].sort();
    const cL=c=>{let l='';while(c>=0){l=String.fromCharCode(65+(c%26))+l;c=Math.floor(c/26)-1;}return l;};

    const s1H=['Engagement code','Engagement name','Name','Level','week','Booking hrs','EIC'];
    const s1Rows=[s1H];
    filtered.forEach(e=>{s1Rows.push([e.engagementCode,e.engagementName,e.name,e.level,e.week,Number(e.hrs)||0,e.eic]);});
    const ws1=XLSX.utils.aoa_to_sheet(s1Rows);
    ws1['!cols']=s1H.map(()=>({wch:18}));

    const eicNames=[];const seen=new Set();
    filtered.forEach(e=>{const k=e.eic+'|'+e.name;if(!seen.has(k)){seen.add(k);eicNames.push({eic:e.eic,name:e.name});}});
    eicNames.sort((a,b)=>a.eic.localeCompare(b.eic)||a.name.localeCompare(b.name));

    const s2Rows=[
      ['EIC','Name',...weeks.map(w=>dayjs(w).format('YYYY-MM-DD')),'Grand Total']
    ];
    eicNames.forEach(({eic,name},i)=>{
      const row=i+2;
      const outRow=[eic,name];
      weeks.forEach((w,j)=>{
        const col=j+2;
        outRow.push({t:'n',v:0,f:`SUMIFS('booking_details_all'!F:F,'booking_details_all'!G:G,$A${row},'booking_details_all'!C:C,$B${row},'booking_details_all'!E:E,${cL(col)}$1)`});
      });
      const tc=weeks.length+2;
      outRow.push({t:'n',v:0,f:`SUM(${cL(2)}${row}:${cL(tc-1)}${row})`});
      s2Rows.push(outRow);
    });
    const ws2=XLSX.utils.aoa_to_sheet(s2Rows);
    ws2['!cols']=[{wch:22},{wch:18},...weeks.map(()=>({wch:10})),{wch:12}];

    const wb=XLSX.utils.book_new();
    wb.Workbook={CalcPr:{calcMode:'auto',fullCalcOnLoad:1}};
    XLSX.utils.book_append_sheet(wb,ws1,'booking_details_all');
    XLSX.utils.book_append_sheet(wb,ws2,'汇总');
    XLSX.writeFile(wb,'排班report.xlsx');
  };

  const exportSGFormat=(data,eic,startWeek,endWeek,isOu)=>{
    const filtered=data.filter(e=>(isOu||e.eic===eic)&&e.week>=startWeek&&e.week<=endWeek);
    // Find all weeks in range
    const weekSet=new Set(filtered.map(e=>e.week));
    const allWeeks=Array.from(weekSet).sort();
    // Group by email → projects
    const emailProjects=new Map();
    filtered.forEach(e=>{
      const staff=findStaffByEmail(e.name+'@example.com');
      const email=staff?staff.email:(e.name+'@example.com');
      const key=email+'|'+e.engagementCode;
      if(!emailProjects.has(key))emailProjects.set(key,{email,name:e.name,engagementCode:e.engagementCode,engagementName:e.engagementName,weeks:{}});
      const rec=emailProjects.get(key);
      rec.weeks[e.week]=(rec.weeks[e.week]||0)+e.hrs;
    });
    // Build CSV
    const rows=[];
    // Row 1: header
    const header=['相关订单','Code Type','Engagement Code','Engagement Name','分类','Section','员工姓名',...allWeeks.map(w=>{
      const fd=dayjs(w);
      const sat=fd.subtract(6,'day');
      return sat._d.getFullYear()+'.'+(sat._d.getMonth()+1)+'.'+sat._d.getDate()+'-'+fd._d.getFullYear()+'.'+(fd._d.getMonth()+1)+'.'+fd._d.getDate();
    })];
    rows.push(header);
    // Data rows
    emailProjects.forEach(rec=>{
      const row=['','Authorized Project',rec.engagementCode,rec.engagementName,'','',rec.email,...allWeeks.map(w=>rec.weeks[w]?String(rec.weeks[w]):'')];
      rows.push(row);
    });
    const csv='\uFEFF'+rows.map(r=>r.map(escapeCSV).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=`booking_sg_${eic||'all'}_${startWeek}_${endWeek}.csv`;
    a.click();URL.revokeObjectURL(url);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal glass-card" onClick={e=>e.stopPropagation()}>
        <h3>{isOu?'导出OU全部EIC数据':'导出排班'}</h3>
        <div className="export-form">
          {!isOu&&<div className="form-group"><label>选择EIC（可搜索）</label><PersonPicker label="导出 EIC" value={eic} onChange={setEic} options={uniqueEics.map(personOption)}/></div>}
          <div className="form-group"><label>选择财年（默认最新财年）</label><select value={fy} onChange={e=>setFy(e.target.value)}>{availableFYs.map(f=><option key={f} value={f}>{f}</option>)}</select></div>
          <div className="form-group"><label>开始周（非必填）</label><input type="date" value={start} onChange={e=>setStart(e.target.value)}/></div>
          <div className="form-group"><label>结束周（非必填）</label><input type="date" value={end} onChange={e=>setEnd(e.target.value)}/></div>
          <div className="form-group">
            <label>导出格式</label>
            <div className="radio-group">
              <label className="radio-option"><input type="radio" name="fmt" checked={exportFormat==='booking'} onChange={()=>setExportFormat('booking')} /><span>Booking Template 格式 (CSV)</span></label>
              <label className="radio-option"><input type="radio" name="fmt" checked={exportFormat==='sg'} onChange={()=>setExportFormat('sg')} /><span>排班小工具数据 (CSV)</span></label>
              {isOu&&<label className="radio-option"><input type="radio" name="fmt" checked={exportFormat==='report'} onChange={()=>setExportFormat('report')} /><span>导出报表 (Excel)</span></label>}
            </div>
          </div>
        </div>
        <div className="modal-actions">
          <button className="glass-btn" onClick={onClose}>取消</button>
          <button className="glass-btn primary-btn" onClick={doExport}>确认导出</button>
        </div>
      </div>
    </div>
  );
}

// ==================== TIMELINE VIEW ====================
function ProjectTimelineApp({ projects, bookingData, updateProjects, onBack, initialView, onOpenOverview }) {
  const gridScrollRef = useRef(null);
  const returnScroll = useRef(initialView ? {top:initialView.scrollTop||0,left:initialView.scrollLeft||0} : null);
  const knownProjectIds = useRef(new Set(projects.map(p=>p.id)));
  const [showImport, setShowImport] = useState(false);
  const [dailyWeek,setDailyWeek]=useState(initialView?.dailyWeek||null);
  const weekScroll=useRef(initialView?.weekScroll||null);
  const drillWeek=week=>{
    weekScroll.current={left:gridScrollRef.current?.scrollLeft||0,top:gridScrollRef.current?.scrollTop||0};
    setDailyWeek(week);
  };
  const backToWeeks=()=>{setDailyWeek(null);};
  React.useLayoutEffect(()=>{
    if(!gridScrollRef.current)return;
    if(dailyWeek){gridScrollRef.current.scrollLeft=returnScroll.current?.left||0;if(returnScroll.current){gridScrollRef.current.scrollTop=returnScroll.current.top;returnScroll.current=null;}}
    else if(weekScroll.current){gridScrollRef.current.scrollLeft=weekScroll.current.left;gridScrollRef.current.scrollTop=weekScroll.current.top;}
  },[dailyWeek]);


  const [selectedFYs, setSelectedFYs] = useState(() => new Set(initialView?.selectedFYs||[getCurrentFY()]));
  const [fyOpen, setFyOpen] = useState(false);
  const [fyDraft, setFyDraft] = useState(() => new Set(initialView?.selectedFYs||[getCurrentFY()]));
  const [fyError, setFyError] = useState('');
  const [showOverdue, setShowOverdue] = useState(false);
  const [showPrint, setShowPrint] = useState(false);
  const [showTaskList, setShowTaskList] = useState(false);
  const [grouped, setGrouped] = useState(initialView?.grouped||false);
  const [expandedProjects, setExpandedProjects] = useState(() => new Set(initialView?.expandedProjects||projects.map(p=>p.id)));
  const [nodeEditor, setNodeEditor] = useState(null);
  const [statusEditor, setStatusEditor] = useState(null);
  const [projectEdit, setProjectEdit] = useState(null); // {projectId} - opens the project edit modal
  const [projectFilter, setProjectFilter] = useState(() => new Set(initialView?.projectFilter||[]));
  const [projFilterOpen, setProjFilterOpen] = useState(false);
  const projFilterRef = useRef(null);

  useEffect(() => {
    if (!projFilterOpen) return;
    const h = (e) => { if (projFilterRef.current && !projFilterRef.current.contains(e.target)) setProjFilterOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [projFilterOpen]);

  const toggleProjFilter = useCallback((pid) => {
    setProjectFilter(prev => {
      const next = new Set(prev);
      if (next.has(pid)) next.delete(pid); else next.add(pid);
      return next;
    });
  }, []);

  const clearProjFilter = useCallback(() => setProjectFilter(new Set()), []);

  const [ficFilter, setFicFilter] = useState(() => new Set(initialView?.ficFilter||[]));
  const [ficFilterOpen, setFicFilterOpen] = useState(false);
  const ficFilterRef = useRef(null);

  useEffect(() => {
    if (!ficFilterOpen) return;
    const h = (e) => { if (ficFilterRef.current && !ficFilterRef.current.contains(e.target)) setFicFilterOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [ficFilterOpen]);

  const allFics = useMemo(() => {
    const fics = new Set();
    projects.forEach(p => { if (p.fic) fics.add(p.fic); });
    return Array.from(fics).sort();
  }, [projects]);

  const toggleFicFilter = useCallback((fic) => {
    setFicFilter(prev => { const n = new Set(prev); if (n.has(fic)) n.delete(fic); else n.add(fic); return n; });
  }, []);

  const clearFicFilter = useCallback(() => setFicFilter(new Set()), []);

  const visibleProjects = useMemo(() => {
    let result = projects;
    if (projectFilter.size > 0) result = result.filter(p => projectFilter.has(p.id));
    if (ficFilter.size > 0) result = result.filter(p => ficFilter.has(p.fic || ''));
    return result;
  }, [projects, projectFilter, ficFilter]);

  const openFY = useCallback((e) => {
    e.stopPropagation(); e.preventDefault();
    setFyDraft(new Set(selectedFYs)); setFyError(''); setFyOpen(prev => !prev);
  }, [selectedFYs]);

  const toggleDraft = useCallback((fy) => {
    setFyDraft(prev => {
      const next = new Set(prev);
      if (next.has(fy)) { next.delete(fy); return next; }
      if (next.size >= 2) return prev;
      next.add(fy); return next;
    });
  }, []);

  const confirmFY = useCallback(() => {
    if (fyDraft.size === 0) { setFyError('至少选择一个财年'); return; }
    if (!areConsecutive(fyDraft)) { setFyError('只能选择连续的两个财年'); return; }
    weekScroll.current=null;setDailyWeek(null);setSelectedFYs(new Set(fyDraft)); setFyError(''); setFyOpen(false);
  }, [fyDraft]);

  const allWeeks = useMemo(() => getFYWeeksForSelection(selectedFYs), [selectedFYs]);
  const taskListDefaultRange = useMemo(() => {
    const years = Array.from(selectedFYs).map(getYearFromFY).sort((a, b) => a - b);
    const first = years[0] || dayjs().year();
    const last = years[years.length - 1] || first;
    return {start: `${first - 1}-07-01`, end: `${last}-06-30`};
  }, [selectedFYs]);

  const weeklyLabels = useMemo(() => {
    return allWeeks.map(w => ({
      week: w,
      label: dayjs(w).format('YY/MM/DD'),
      phase: getPhaseLabel(w)
    }));
  }, [allWeeks]);

  const weekLabels=useMemo(()=>dailyWeek?Array.from({length:7},(_,i)=>{
    const date=dayjs(dailyWeek).subtract(6-i,'day').format('YYYY-MM-DD');
    return {week:date,sourceWeek:dailyWeek,label:dayjs(date).format('YY/MM/DD'),dayLabel:['周六','周日','周一','周二','周三','周四','周五'][i],phase:getPhaseLabel(dailyWeek)};
  }):weeklyLabels,[dailyWeek,weeklyLabels]);
  const inColumn=(node,column)=>dailyWeek?(node.date||node.week)===column.week:node.week===column.week;

  const nodeWidths = useMemo(() => {
    const context=document.createElement('canvas').getContext('2d');
    if(context)context.font='600 11px '+getComputedStyle(document.body).fontFamily;
    return Object.fromEntries(projects.flatMap(p=>p.nodes.map(n=>{
      const text=String(n.name||'');
      const fallbackWidth=Array.from(text).reduce((width,char)=>width+(/[\u0000-\u007f]/.test(char)?7:11),0);
      const textWidth=Math.max(fallbackWidth,context?context.measureText(text).width:0);
      return [n.id,Math.max(72,Math.ceil(textWidth)+(n.note?.trim()?19:0)+(n.attention?.trim()?19:0)+16)];
    })));
  }, [projects]);
  const columnWidths = useMemo(() => {
    const widths = {};
    weekLabels.forEach(w => {
      const occupied=projects.map(p=>p.nodes.filter(n=>inColumn(n,w)).reduce((sum,n)=>sum+nodeWidths[n.id],0));
      widths[w.week]=Math.max(80,...occupied.map(width=>width+10));
    });
    return widths;
  }, [weekLabels, projects, nodeWidths, dailyWeek]);

  // A return from project overview restores both axes; ordinary entries/FY changes locate this week.
  React.useLayoutEffect(() => {
    if (!gridScrollRef.current || allWeeks.length === 0 || dailyWeek) return;
    if(returnScroll.current){
      gridScrollRef.current.scrollTop=returnScroll.current.top;
      gridScrollRef.current.scrollLeft=returnScroll.current.left;
      returnScroll.current=null;
      return;
    }
    const today = getFridayOfWeek(dayjs()).format('YYYY-MM-DD');
    const idx = allWeeks.indexOf(today);
    const targetIdx = idx >= 0 ? idx : 0;
    // Don't add sticky col-name width (210px) — the sticky column overlays the viewport,
    // so scrollLeft = sum of week widths before target puts the target right after it.
    let px = 0;
    for (let i = 0; i < targetIdx; i++) {
      px += (columnWidths[allWeeks[i]] || 80);
    }
    const timer=setTimeout(() => { if (gridScrollRef.current) gridScrollRef.current.scrollLeft = px; }, 100);
    return ()=>clearTimeout(timer);
  }, [allWeeks]);

  useEffect(()=>{
    const root=document.documentElement;
    let dragTarget=null,startX=0,startW=0;
    const onDown=e=>{
      const handle=e.target.closest('.resize-handle');
      if(!handle)return;
      dragTarget=handle.parentElement;
      startX=e.clientX;
      startW=parseFloat(getComputedStyle(root).getPropertyValue('--tl-col-name-w'))||210;
      e.preventDefault();
    };
    const onMove=e=>{
      if(!dragTarget)return;
      const delta=e.clientX-startX;
      const newW=Math.max(120,Math.min(400,startW+delta));
      root.style.setProperty('--tl-col-name-w',newW+'px');
    };
    const onUp=()=>{dragTarget=null;};
    document.addEventListener('mousedown',onDown);
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousedown',onDown);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  },[]);

  useEffect(()=>{
    const currentIds=new Set(projects.map(p=>p.id)),previousIds=knownProjectIds.current;
    setExpandedProjects(prev=>{
      const next=new Set(Array.from(prev).filter(id=>currentIds.has(id)));let changed=next.size!==prev.size;
      projects.forEach(p=>{if(!previousIds.has(p.id)){next.add(p.id);changed=true;}});
      return changed?next:prev;
    });
    knownProjectIds.current=currentIds;
  },[projects]);

  const openOverview=project=>onOpenOverview(project,{
    selectedFYs:Array.from(selectedFYs),grouped,expandedProjects:Array.from(expandedProjects),
    projectFilter:Array.from(projectFilter),ficFilter:Array.from(ficFilter),
    dailyWeek,weekScroll:weekScroll.current,scrollTop:gridScrollRef.current?.scrollTop||0,scrollLeft:gridScrollRef.current?.scrollLeft||0
  });

  const handleSaveProjectEdit = useCallback((id, data) => {
    updateProjects(projects.map(p => p.id === id ? { ...p, ...data } : p));
    setProjectEdit(null);
  }, [projects, updateProjects]);

  const handleDeleteProject = useCallback((id) => {
    updateProjects(projects.filter(p => p.id !== id));
  }, [projects, updateProjects]);

  const handleSaveNode = useCallback((projectId, week, nodeData, editNodeId) => {
    // Recalculate week from the chosen date so the node moves if the date changed
    const d = parseWeekString(nodeData.date);
    const computedWeek = d ? getFridayOfWeek(d).format('YYYY-MM-DD') : week;
    updateProjects(projects.map(p => {
      if (p.id !== projectId) return p;
      let nodes = [...p.nodes];
      if (editNodeId) {
        nodes = nodes.map(n => n.id === editNodeId ? { ...n, ...nodeData, week: computedWeek } : n);
      } else {
        nodes.push({ id: 'n' + Date.now() + '_' + Math.random().toString(36).slice(2), week: computedWeek, ...nodeData });
      }
      return { ...p, nodes };
    }));
  }, [projects, updateProjects]);

  const handleDeleteNode = useCallback((projectId, nodeId) => {
    updateProjects(projects.map(p => p.id === projectId ? { ...p, nodes: p.nodes.filter(n => n.id !== nodeId) } : p));
  }, [projects, updateProjects]);

  const handleStatusUpdate = useCallback((projectId, nodeId, completed, note, actualDate) => {
    updateProjects(projects.map(p => {
      if (p.id !== projectId) return p;
      return { ...p, nodes: p.nodes.map(n => {
        if (n.id !== nodeId) return n;
        return applyWorkspaceNodeStatus(n,completed,note,actualDate);
      })};
    }));
  }, [projects, updateProjects]);

  const handleExport = useCallback(() => {
    const rows = [['Engagement Name','FIC','Engagement Code','Section','底稿数规模','项目预算','项目组EIC','项目组FIC','节点名称','节点分组','具体日期','完成状态','进展说明','服务单号','订单号','Canvas ID']];
    projects.forEach(p => {
      if(!p.nodes.length)rows.push([p.name,p.fic||'',p.code||'',p.section||'',p.papers||'',p.budget||'',p.eic||'',p.teamFic||'','','','','','',p.serviceOrderNo||'',p.orderNo||'',p.canvasId||'']);
      p.nodes.forEach(n => {
        const st = n.completed === 'Y' ? (n.delayed?'已完成(延迟)':'已完成') : n.completed === 'N' ? '未完成' : '待确认';
        rows.push([p.name, p.fic||'', p.code||'', p.section||'', p.papers||'', p.budget||'', p.eic||'', p.teamFic||'', n.name, n.group||getGroupLabel(n.name), n.date||'', st, n.note||'',p.serviceOrderNo||'',p.orderNo||'',p.canvasId||'']);
      });
    });
    const csv = '\uFEFF' + rows.map(r => r.map(escapeCSV).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `project_nodes_${Array.from(selectedFYs).join('_')}_${dayjs().format('YYYY-MM-DD')}.csv`;
    a.click(); URL.revokeObjectURL(url);
  }, [projects, selectedFYs]);

  const handleImport = useCallback((file) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        // Keep CSV dates as written so invalid dates cannot be normalized before validation.
        const csv=/\.csv$/i.test(file.name);
        const wb = XLSX.read(csv?new TextDecoder('utf-8').decode(data):data, { type:csv?'string':'array', raw: true, cellDates:true });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = readProjectNodeImportRows(sheet);
        // Match existing projects by the Engagement Code column, regardless of column order.
        const projectByCode = {};
        projects.forEach(p => { if (p.code) projectByCode[p.code] = p; });
        const newNodesByCode = {};
        const infoByCode = {};
        let skipped = 0, imported = 0;

        for (const row of rows) {
          const {rowNumber,code:pCode,fic:pFic,section:pSection,papers:pPapers,eic:pEic,teamFic:pTeamFic,serviceOrderNo,orderNo,canvasId,nodeName:nName,nodeGroup:nGroup,date:dRaw,completed:sRaw,note}=row;

          // Must match an existing project by code
          const existing = pCode ? projectByCode[pCode] : null;
          if (!existing) { skipped++; continue; }

          // Collect supplementary project info (FIC, section, papers, etc.)
          if (!infoByCode[pCode]) infoByCode[pCode] = {};
          if (pFic) infoByCode[pCode].fic = normalizeName(pFic);
          if (pSection) infoByCode[pCode].section = pSection;
          if (pPapers) infoByCode[pCode].papers = pPapers;
          if (pEic) infoByCode[pCode].eic = normalizeName(pEic);
          if (pTeamFic) infoByCode[pCode].teamFic = normalizeName(pTeamFic);
          if (serviceOrderNo) infoByCode[pCode].serviceOrderNo = serviceOrderNo;
          if (orderNo) infoByCode[pCode].orderNo = orderNo;
          if (canvasId) infoByCode[pCode].canvasId = canvasId;

          // Collect nodes
          if (nName) {
            const dd = parseNodeImportDate(dRaw);
            if(!dd)throw Error(`第 ${rowNumber} 行节点日期无效：${dRaw||'未填写'}。请填写有效日期，如 2026-09-25；本次文件未导入。`);
            const date = dd.format('YYYY-MM-DD');
            const week = getFridayOfWeek(dd).format('YYYY-MM-DD');
            const {completed,delayed} = nodeImportedStatus(sRaw);
            if (!newNodesByCode[pCode]) newNodesByCode[pCode] = [];
            newNodesByCode[pCode].push({ id: 'n'+Date.now()+'_'+Math.random().toString(36).slice(2), name: nName, date, week, group: nGroup||getGroupLabel(nName), completed, note, highlight: false, delayed, actualDate: '' });
            imported++;
          }
        }

        // Validate name fields
        const nameErrors=[];
        Object.entries(infoByCode).forEach(([code,info])=>{
          if(info.fic&&!BookingStaff.isFicName(info.fic,STAFF_MASTER))nameErrors.push(`项目 ${code} FIC "${info.fic}"：请选择 masterdata 中的 Senior 或 Staff，不能选择 Manager`);
          if(info.eic&&!/^[A-Za-z0-9.-]+(?:\s*[,，]\s*[A-Za-z0-9.-]+)*$/.test(info.eic))nameErrors.push(`项目 ${code} EIC "${info.eic}"：须用点号连接，如 Example.Person`);
          if(info.teamFic&&!BookingStaff.isFicName(info.teamFic,STAFF_MASTER))nameErrors.push(`项目 ${code} 项目组 FIC "${info.teamFic}"：请选择 masterdata 中的 Senior 或 Staff，不能选择 Manager`);
        });
        if(nameErrors.length>0){alert('人员信息不符合要求：\n'+nameErrors.join('\n'));resolve(false);return;}

        // Apply updates to existing projects
        const next = projects.map(p => {
          if (!p.code) return p;
          const info = infoByCode[p.code];
          const newNodes = newNodesByCode[p.code];
          if (!info && !newNodes) return p;
          return {
            ...p,
            ...(info || {}),
            nodes: newNodes ? [...p.nodes, ...newNodes] : p.nodes,
          };
        });

        updateProjects(next);
        alert(`导入完成：${imported} 个节点，${Object.keys(infoByCode).length} 个项目信息已更新，跳过 ${skipped} 行（未匹配到已有项目）`);
        resolve(true);
      } catch (err) { alert('导入失败：' + err.message); resolve(false); }
    };
    reader.onerror = () => { alert('读取文件失败，请重新选择文件。'); resolve(false); };
    reader.readAsArrayBuffer(file);
  }), [projects, updateProjects]);

  const toggleProjectExpand = useCallback((pid) => {
    setExpandedProjects(prev => {
      const next = new Set(prev);
      if (next.has(pid)) next.delete(pid); else next.add(pid);
      return next;
    });
  }, []);

  return (
    <div className="sub-app timeline-app">
      <WorkspaceHeader section="EIC 管理" onBack={onBack}/>
      <div className="timeline-heading"><PageHeading title="项目时间表" label="PROJECT MILESTONES" detail="交付节点与完成情况"/>
        <div className="view-actions">
          <button className="glass-btn primary-btn" onClick={() => setShowTaskList(true)}><UIIcon name="file"/> 导出Task List</button>
          <button className="glass-btn nav-btn" onClick={handleExport}><UIIcon name="download"/> 导出CSV</button>
          <button className="glass-btn nav-btn" onClick={() => setShowImport(true)}><UIIcon name="upload"/> 导入</button>
          <button className="glass-btn nav-btn" onClick={() => setShowPrint(true)}><UIIcon name="printer"/> 打印</button>
        </div>
      </div>
      <nav className="view-tabs" aria-label="项目节点视图"><button className={!showOverdue?'active':''} onClick={() => setShowOverdue(false)}>项目时间表</button><button className={showOverdue?'active':''} onClick={() => setShowOverdue(true)}>逾期汇总</button><span className="view-count">{visibleProjects.length} 个项目</span></nav>
      <div className="timeline-toolbar">
        {dailyWeek?<><button className="glass-btn" onClick={backToWeeks}>返回周视图</button><span className="timeline-day-range">日视图：{getWeekRange(dailyWeek).start} ～ {dailyWeek}</span></>:<span className="timeline-day-hint">双击周标题，展开七天节点</span>}

        <div className="fy-multi-wrap">
          <button className="fy-trigger" onClick={openFY} style={{width:'130px',justifyContent:'space-between'}}>
            {Array.from(selectedFYs).sort().join(' + ')}
            <span className="arrow">▼</span>
          </button>
          {fyOpen && (
            <>
              <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:998}} onClick={() => { setFyOpen(false); setFyDraft(new Set(selectedFYs)); }}></div>
              <div className="fy-dropdown" onClick={e => e.stopPropagation()}>
                {FY_LIST.map(f => (
                  <label key={f} className={`fy-dropdown-item${fyDraft.has(f) ? ' checked' : ''}`}>
                    <input type="checkbox" checked={fyDraft.has(f)} onChange={() => toggleDraft(f)} />
                    {f}
                  </label>
                ))}
                {fyError && <div className="fy-dropdown-err">{fyError}</div>}
                <div className="fy-dropdown-foot">
                  <button className="glass-btn small-btn" onClick={confirmFY} style={{padding:'5px 14px',fontSize:'12px'}}>确认</button>
                </div>
              </div>
            </>
          )}
          {!fyOpen && fyError && <span style={{fontSize:'11px',color:'#DC2626',marginLeft:'6px'}}>{fyError}</span>}
        </div>
        <div className="fy-multi-wrap" ref={projFilterRef}>
          <button className="fy-trigger" onClick={() => setProjFilterOpen(prev => !prev)} style={{width:'130px',justifyContent:'space-between'}}>
            {projectFilter.size > 0 ? `项目 (${projectFilter.size})` : '全部项目'}
            <span className="arrow">▼</span>
          </button>
          {projFilterOpen && (
            <>
              <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:998}} onClick={() => setProjFilterOpen(false)}></div>
              <div className="fy-dropdown" onClick={e => e.stopPropagation()}>
                {projects.length > 0 ? projects.map(p => (
                  <label key={p.id} className={`fy-dropdown-item${projectFilter.has(p.id) ? ' checked' : ''}`}>
                    <input type="checkbox" checked={projectFilter.has(p.id)} onChange={() => toggleProjFilter(p.id)} />
                    {p.name}
                  </label>
                )) : <div style={{padding:'8px 14px',fontSize:'12px',color:"var(--muted)"}}>暂无项目</div>}
                <div className="fy-dropdown-foot">
                  {projectFilter.size > 0 && <button className="glass-btn small-btn" onClick={clearProjFilter} style={{padding:'5px 10px',fontSize:'11px'}}>清除</button>}
                </div>
              </div>
            </>
          )}
        </div>
        <div className="fy-multi-wrap" ref={ficFilterRef}>
          <button className="fy-trigger" onClick={() => setFicFilterOpen(prev => !prev)} style={{width:'130px',justifyContent:'space-between'}}>
            {ficFilter.size > 0 ? `FIC (${ficFilter.size})` : '全部FIC'}
            <span className="arrow">▼</span>
          </button>
          {ficFilterOpen && (
            <>
              <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:998}} onClick={() => setFicFilterOpen(false)}></div>
              <div className="fy-dropdown" onClick={e => e.stopPropagation()}>
                <PersonSearchList names={allFics} selected={ficFilter} onToggle={toggleFicFilter} label="搜索时间表 FIC" emptyText="暂无FIC" rowClassName="fy-dropdown-item"/>
                <div className="fy-dropdown-foot">
                  {ficFilter.size > 0 && <button className="glass-btn small-btn" onClick={clearFicFilter} style={{padding:'5px 10px',fontSize:'11px'}}>清除</button>}
                </div>
              </div>
            </>
          )}
        </div>
        <button className={`toggle-group-btn ${grouped ? 'active' : ''}`} style={{width:'130px',justifyContent:'center'}} onClick={() => {
          if (grouped) { setExpandedProjects(new Set(visibleProjects.map(p => p.id))); }
          else { setExpandedProjects(new Set()); }
          setGrouped(!grouped);
        }}>
          {grouped ? '▸ 展开全部' : '▾ 收起完成情况'}
        </button>

      </div>
      <div className="sub-content">
        {projects.length === 0 ? (
          <div className="empty-state">暂无项目数据，请先在排班管理中上传排班数据</div>
        ) : (
        <div className="timeline-grid-container">
          <div className="timeline-grid-scroll" ref={gridScrollRef}>
              <table className="timeline-grid">
                <thead>
                  <tr>
                    <th className="col-name" rowSpan="2" style={{verticalAlign:'middle'}}>项目名称<div className="resize-handle"></div></th>
                    {weekLabels.map(w => (
                      <th key={w.week} className="col-week" onDoubleClick={()=>{if(!dailyWeek)drillWeek(w.week);}} title={dailyWeek?w.dayLabel:"双击展开本周七天"} style={{cursor:dailyWeek?"default":"zoom-in",width:columnWidths[w.week]+'px',minWidth:columnWidths[w.week]+'px'}}>
                        <div className="week-header-date">{w.label}</div>
                      </th>
                    ))}
                  </tr>
                  <tr>
                    {weekLabels.map(w => (
                       <th key={w.week} className="col-week" onDoubleClick={()=>{if(!dailyWeek)drillWeek(w.week);}} title={dailyWeek?w.dayLabel:"双击展开本周七天"} style={{cursor:dailyWeek?"default":"zoom-in",width:columnWidths[w.week]+'px',minWidth:columnWidths[w.week]+'px',background:'var(--dark)'}}>
                        <span className={`week-header-phase ${w.phase}`}>
                          {dailyWeek?w.dayLabel:(w.phase === 'pre' ? '预审' : '年审')}
                        </span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {visibleProjects.map((project, pi) => {
                    const color = getProjectColor(project.code || project.id);
                    const bgLight = color + '3b';
                    const isExpanded = expandedProjects.has(project.id);

                    const nodeRow = (
                      <tr key={project.id + '-node'} className="node-row">
                        <td className="col-name" style={{background:'#FFFFFF'}}>
                          <div className="proj-name-wrap" onDoubleClick={() => setProjectEdit({projectId: project.id})} style={{cursor:'pointer'}} title="双击编辑项目信息">
                            <span className="proj-expand-btn" onClick={(e) => { e.stopPropagation(); toggleProjectExpand(project.id); }} title={isExpanded?'收起':'展开'} style={{fontSize:11,padding:'0 4px'}}>
                              {isExpanded ? '▼' : '▶'}
                            </span>
                            <span className="project-color-strip" style={{backgroundColor:color}}></span>
                            <span className="proj-name-copy">
                              <span className="proj-title-line"><span className="project-name">{project.name}</span><button type="button" className="project-overview-link" disabled={!project.code} aria-label={'打开项目总览：'+project.name} title={project.code?'打开项目总览':'请先填写项目编码，再进入项目总览'} onClick={e=>{e.stopPropagation();openOverview(project);}} onDoubleClick={e=>e.stopPropagation()}><UIIcon name="arrow"/></button><span className="proj-name-actions">
                              <span className="proj-action-btn del" title="删除项目" onClick={(e) => { e.stopPropagation(); if (confirm(`删除项目「${project.name}」？`)) handleDeleteProject(project.id); }}>✕</span>
                            </span></span>
                              <span style={{display:'block',fontSize:'11px',fontWeight:400,marginTop:'2px',fontFamily:"var(--font)",color:project.fic?"var(--muted)":'#DC2626'}}>FIC: {project.fic || '请补充FIC'}{BookingStaff.isPendingName(project.fic)&&<span className="pending-person-badge">Pending</span>}</span>
                            </span>
                          </div>
                        </td>
                        {weekLabels.map(w => {
                          const nodesInWeek = project.nodes.filter(n => inColumn(n,w)).sort((a,b)=>String(a.date||a.week).localeCompare(String(b.date||b.week)));
                          const hasNodes = nodesInWeek.length > 0;
                          return (
                            <td key={w.week}
                              className={`node-date-cell${!hasNodes ? ' dbl-hint' : hasNodes ? ' has-nodes' : ''}`}
                              style={{background:hasNodes?bgLight:'transparent',width:columnWidths[w.week]+'px'}}
                              onDoubleClick={(e) => {
                                if (e.target.classList.contains('add-node-btn')) return;
                                setNodeEditor({ projectId: project.id, week: w.sourceWeek || w.week, initialDate:dailyWeek?w.week:undefined });
                              }}
                              title={hasNodes ? '双击空白处或点+添加节点' : '双击添加节点'}>
                              {hasNodes && (
                                <span className="add-node-btn"
                                  onClick={(e) => { e.stopPropagation(); setNodeEditor({ projectId: project.id, week: w.sourceWeek || w.week, initialDate:dailyWeek?w.week:undefined }); }}
                                  title="添加节点">+</span>
                              )}
                              {hasNodes ? nodesInWeek.map(n => (
                                <div key={n.id} className="node-slot" style={{width:nodeWidths[n.id],minWidth:nodeWidths[n.id],maxWidth:nodeWidths[n.id]}}
                                  onDoubleClick={(e) => { e.stopPropagation(); setNodeEditor({ projectId: project.id, week: w.sourceWeek || w.week, initialDate:dailyWeek?w.week:undefined, editNodeId: n.id }); }}
                                  title={n.name}>
                                  <span className={`node-date-text${n.highlight ? ' highlighted' : ''}`}>{dayjs(n.date || n.week).format('YY/MM/DD')}</span>
                                </div>
                              )) : null}
                            </td>
                          );
                        })}
                      </tr>
                    );

                    const nameRow = (
                      <tr key={project.id + '-name'} className={isExpanded ? "completion-row node-name-row" : "node-name-row"}>
                        <td className="col-name" style={{background:'#FFFFFF'}}>
                          {isExpanded ? <span style={{fontSize:'11px',color:"var(--muted)",fontStyle:'italic'}}>节点</span> : (
                            <div className="proj-name-wrap" onDoubleClick={() => setProjectEdit({projectId: project.id})} style={{cursor:'pointer'}} title="双击编辑项目信息">
                              <span className="proj-expand-btn" onClick={(e) => { e.stopPropagation(); toggleProjectExpand(project.id); }} title={isExpanded?'收起':'展开'} style={{fontSize:11,padding:'0 4px'}}>
                                {isExpanded ? '▼' : '▶'}
                              </span>
                              <span className="project-color-strip" style={{backgroundColor:color}}></span>
                              <span className="proj-name-copy">
                                <span className="proj-title-line"><span className="project-name">{project.name}</span><button type="button" className="project-overview-link" disabled={!project.code} aria-label={'打开项目总览：'+project.name} title={project.code?'打开项目总览':'请先填写项目编码，再进入项目总览'} onClick={e=>{e.stopPropagation();openOverview(project);}} onDoubleClick={e=>e.stopPropagation()}><UIIcon name="arrow"/></button><span className="proj-name-actions">
                                <span className="proj-action-btn del" title="删除项目" onClick={(e) => { e.stopPropagation(); if (confirm(`删除项目「${project.name}」？`)) handleDeleteProject(project.id); }}>✕</span>
                              </span></span>
                                <span style={{display:'block',fontSize:'11px',fontWeight:400,marginTop:'2px',fontFamily:"var(--font)",color:project.fic?"var(--muted)":'#DC2626'}}>FIC: {project.fic || '请补充FIC'}{BookingStaff.isPendingName(project.fic)&&<span className="pending-person-badge">Pending</span>}</span>
                              </span>
                            </div>
                          )}
                        </td>
                        {weekLabels.map(w => {
                          const nodesInWeek = project.nodes.filter(n => inColumn(n,w)).sort((a,b)=>String(a.date||a.week).localeCompare(String(b.date||b.week)));
                          return (
                            <td key={w.week} style={{background:nodesInWeek.length>0?bgLight:'transparent',width:columnWidths[w.week]+'px'}}>
                              {nodesInWeek.length > 0 ? nodesInWeek.map(n => (
                                <div key={n.id} className="status-slot" style={{width:nodeWidths[n.id],minWidth:nodeWidths[n.id],maxWidth:nodeWidths[n.id]}}
                                  onClick={() => setStatusEditor({ projectId: project.id, nodeId: n.id })}
                                  title={n.note || n.name}>
                                  <span className={`status-name${n.highlight ? ' highlighted' : ''}`}>{n.name}</span>{n.attention?.trim()&&<span className="node-progress-info node-attention-info" title={n.attention} aria-label={"节点注意事项："+n.attention}>!</span>}{n.note?.trim()&&<span className="node-progress-info" title={n.note} aria-label={"节点进展："+n.note}>?</span>}
                                </div>
                              )) : null}
                            </td>
                          );
                        })}
                      </tr>
                    );

                    const statusRow = isExpanded ? (
                      <tr key={project.id + '-status'} className="completion-row">
                        <td className="col-name" style={{background:'#FFFFFF',fontSize:'11px',color:"var(--muted)",fontStyle:'italic'}}>
                          状态
                        </td>
                        {weekLabels.map(w => {
                          const nodesInWeek = project.nodes.filter(n => inColumn(n,w)).sort((a,b)=>String(a.date||a.week).localeCompare(String(b.date||b.week)));
                          return (
                            <td key={w.week} style={{background:"var(--surface-tint)",width:columnWidths[w.week]+'px'}}>
                              {nodesInWeek.length > 0 ? nodesInWeek.map(n => {
                                const isOverdue = isNodeOverdue(n);
                                let bc = 'pending', bt = '—';
                                if (n.completed === 'Y' && n.delayed) { bc = 'delayed'; bt = 'Y⌛'; }
                                else if (n.completed === 'Y') { bc = 'done'; bt = 'Y'; }
                                else if (isOverdue || n.completed === 'N') { bc = 'overdue'; bt = 'N'; }
                                return (
                                  <div key={n.id} className="status-slot" style={{width:nodeWidths[n.id],minWidth:nodeWidths[n.id],maxWidth:nodeWidths[n.id]}}
                                    onClick={() => setStatusEditor({ projectId: project.id, nodeId: n.id })}
                                    title={n.note || n.name}>
                                    <span className={`status-badge ${bc}`}>{bt}</span>
                                  </div>
                                );
                              }) : null}
                            </td>
                          );
                        })}
                      </tr>
                    ) : null;

                    const separator = pi < visibleProjects.length - 1 ? (
                      <tr key={project.id + '-sep'} className="project-separator">
                        <td colSpan={weekLabels.length + 1} style={{padding:'0',height:'4px',border:'none'}}></td>
                      </tr>
                    ) : null;

                    return [isExpanded ? nodeRow : null, nameRow, isExpanded ? statusRow : null, separator].filter(Boolean);
                  })}
                </tbody>
              </table>
            </div>
        </div>
          )}
      </div>

      {nodeEditor && (
        <NodeEditorModal
          project={projects.find(p => p.id === nodeEditor.projectId)}
          week={nodeEditor.week}
          initialDate={nodeEditor.initialDate}
          editNode={nodeEditor.editNodeId ? projects.find(p => p.id === nodeEditor.projectId)?.nodes.find(n => n.id === nodeEditor.editNodeId) : null}
          onSave={(nodeData) => { handleSaveNode(nodeEditor.projectId, nodeEditor.week, nodeData, nodeEditor.editNodeId); setNodeEditor(null); }}
          onDelete={nodeEditor.editNodeId ? () => { handleDeleteNode(nodeEditor.projectId, nodeEditor.editNodeId); setNodeEditor(null); } : null}
          onClose={() => setNodeEditor(null)}
        />
      )}

      {statusEditor && (
        <StatusModal
          project={projects.find(p => p.id === statusEditor.projectId)}
          node={projects.find(p => p.id === statusEditor.projectId)?.nodes.find(n => n.id === statusEditor.nodeId)}
          onSave={(completed, note, actualDate) => { handleStatusUpdate(statusEditor.projectId, statusEditor.nodeId, completed, note, actualDate); setStatusEditor(null); }}
          onDelete={() => { handleDeleteNode(statusEditor.projectId, statusEditor.nodeId); setStatusEditor(null); }}
          onClose={() => setStatusEditor(null)}
        />
      )}
      {showImport && (
        <ImportModal
          onImport={handleImport}
          onClose={() => setShowImport(false)}
        />
      )}
      {projectEdit && (
        <ProjectEditModal
          project={projects.find(p => p.id === projectEdit.projectId)}
          onSave={(data) => handleSaveProjectEdit(projectEdit.projectId, data)}
          onDelete={() => { const p = projects.find(x => x.id === projectEdit.projectId); if (p && confirm('删除项目「' + p.name + '」？')) { handleDeleteProject(projectEdit.projectId); } setProjectEdit(null); }}
          onClose={() => setProjectEdit(null)}
        />
      )}
      {showOverdue && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:500,background:'#FFFFFF'}}>
          <OverdueApp projects={projects} updateProjects={updateProjects} onBack={() => setShowOverdue(false)} />
        </div>
      )}
      {showPrint && (
        <PrintModal
          weekLabels={dailyWeek?weeklyLabels.filter(w=>w.week===dailyWeek):weeklyLabels}
          visibleProjects={visibleProjects}
          columnWidths={columnWidths}
          onClose={() => setShowPrint(false)}
        />
      )}
      {showTaskList && (
        <TaskListBuilderModal
          projects={projects}
          bookingData={bookingData}
          defaultStart={taskListDefaultRange.start}
          defaultEnd={taskListDefaultRange.end}
          onClose={() => setShowTaskList(false)}
        />
      )}
    </div>
  );
}


// ==================== TASK LIST BUILDER ====================
function TaskListBuilderModal({ projects, bookingData, defaultStart, defaultEnd, onClose, focusProjectCode, projectScope, onSaved }) {
  const [step, setStep] = useState('period');
  const [periodStart, setPeriodStart] = useState(defaultStart);
  const [periodEnd, setPeriodEnd] = useState(defaultEnd);
  const [baseRows, setBaseRows] = useState([]);
  const [overlaps, setOverlaps] = useState([]);
  const workspace=React.useContext(WorkspaceContext);
  const draft=useTaskDraft();
  const {tasks,deletedSources}=draft.value;
  const coveredSourceKeys=new Set(draft.value.coveredSourceKeys);
  useEffect(()=>{
    if(step!=='editor')return;
    const handler=e=>{
      if(!historyShortcut(e)||document.querySelector('.tasklist-sub-overlay'))return;
      e.preventDefault();isRedoShortcut(e)?draft.redo():draft.undo();
    };
    document.addEventListener('keydown',handler);return()=>document.removeEventListener('keydown',handler);
  },[step,draft.undo,draft.redo]);
  const [bulkStartDate, setBulkStartDate] = useState('');
  const [selectedTaskIds, setSelectedTaskIds] = useState(new Set());
  const [bulkAssigneeIds, setBulkAssigneeIds] = useState(null);
  const selectedTasks = tasks.filter(task => selectedTaskIds.has(task.id));
  const selectedCount = selectedTasks.length;
  useEffect(() => {
    setSelectedTaskIds(prev => {
      const live = new Set(tasks.map(task => task.id));
      const next = new Set([...prev].filter(id => live.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, [tasks]);
  const applyBulkStart = () => {
    if (!selectedCount || !bulkStartDate) return;
    if (selectedTasks.some(task => task.dueDate && bulkStartDate > task.dueDate)) {
      setError('所选任务中有截止日早于该开始日的任务，请调整日期或勾选范围；本次未修改。');setMessage('');return;
    }
    draft.change('批量修改 Task 开始日', d => {d.tasks=d.tasks.map(task => selectedTaskIds.has(task.id)?{...task,startDate:bulkStartDate}:task);});
    setError('');setMessage(`已修改 ${selectedCount} 条所选任务的开始日；保存后生效。`);
  };
  const deleteSelectedTasks = () => {
    if (!selectedCount || !confirm(`删除选中的 ${selectedCount} 条 Task？可通过“撤销编辑”恢复。`)) return;
    draft.change('批量删除 Task', d => {
      const removed=d.tasks.filter(task=>selectedTaskIds.has(task.id));
      d.tasks=d.tasks.filter(task=>!selectedTaskIds.has(task.id));
      const sources=new Map(removed.filter(task=>task.sourceKey).map(task=>[task.sourceKey,task]));
      for(const [sourceKey,task] of sources){
        d.deletedSources=d.deletedSources.filter(item=>item.sourceKey!==sourceKey);
        const sourceDate=normalizeTaskListDate(task.sourceDate||task.dueDate);
        if(!d.tasks.some(item=>item.sourceKey===sourceKey)&&sourceDate)d.deletedSources.push({sourceKey,sourceDate});
      }
    });
    setSelectedTaskIds(new Set());setError('');setMessage(`已删除 ${selectedCount} 条所选任务；保存后生效。`);
  };

  const [assigneeTaskId, setAssigneeTaskId] = useState(null);
  const [splitTaskId, setSplitTaskId] = useState(null);
  const [error, setError] = useState('');
  const [message, setMessage] = useState('');
  const taskTableRef = useRef(null);
  const taskProjects=useMemo(()=>taskListProjectCatalog(projects,bookingData,workspace?.data.budgetData),[projects,bookingData,workspace?.data.budgetData]);
  const projectOptions=useMemo(()=>taskProjects.map(p=>({value:taskListProjectValue(p),label:p.name,detail:p.code||'',keywords:p.eic||''})),[taskProjects]);
  useTaskRowHeights(taskTableRef,tasks,step);

  const getStaffOptions = useCallback((task) => getTaskListProjectStaffPool(bookingData, task, tasks, taskProjects), [bookingData, tasks, taskProjects]);

  const openEditor = useCallback((rows, coverageKeys, priorDeletedSources) => {
    const linkedRows=rows.map(task=>{const project=projectScope||resolveTaskListProject(task,taskProjects);return project?{...task,...taskListProjectFields(project)}:task;});
    draft.reset({tasks:linkedRows,coveredSourceKeys:Array.from(coverageKeys || rows.map(task => task.sourceKey).filter(Boolean)),deletedSources:Array.isArray(priorDeletedSources) ? priorDeletedSources : []});
    setError('');
    setMessage('');
    setSelectedTaskIds(new Set());
    setStep('editor');
  }, [taskProjects,projectScope]);

  useEffect(()=>{if(step==='editor'&&focusProjectCode&&taskTableRef.current){const row=Array.from(taskTableRef.current.querySelectorAll('[data-task-project]')).find(row=>row.dataset.taskProject===focusProjectCode);if(row)taskTableRef.current.scrollTop=Math.max(0,row.offsetTop-60);}},[step]);

  const handlePrepare = useCallback(() => {
    setError('');
    setMessage('');
    if (!periodStart || !periodEnd) { setError('请选择开始日和结束日。'); return; }
    if (periodStart > periodEnd) { setError('开始日不能晚于结束日。'); return; }
    const {generated,overlaps:found} = prepareTaskListPeriod(projects,loadSavedTaskLists(),periodStart,periodEnd,projectScope);
    setBaseRows(generated);
    setOverlaps(found);
    if (found.length > 0) setStep('conflict');
    else openEditor(generated, generated.map(task => task.sourceKey), []);
  }, [periodStart, periodEnd, projects, projectScope, openEditor]);

  const updateTask = useCallback((id, updates) => {
    draft.change('编辑 Task',d=>{d.tasks=d.tasks.map(task=>task.id===id?{...task,...updates}:task);},id+':'+Object.keys(updates).join(','));
    setError('');
    setMessage('');
  }, []);

  const applySplit = useCallback((count) => {
    draft.change('拆分 Task',d=>{d.tasks=splitTaskListRow(d.tasks,splitTaskId,count);});
    setSplitTaskId(null);
    setError('');
    setMessage('');
  }, [splitTaskId]);

  const persistCurrent = useCallback(() => {
    const problems = validateTaskListRows(tasks, periodStart, periodEnd, taskProjects);
    if (problems.length > 0) {
      const shown = problems.slice(0, 4).join('；');
      setError(`${shown}${problems.length > 4 ? `；另有 ${problems.length - 4} 项` : ''}`);
      setMessage('');
      return false;
    }
    try {
      const saved=saveTaskListSnapshot(periodStart, periodEnd, tasks, coveredSourceKeys, deletedSources, workspace?.saveTasks, projectScope);
      onSaved?.(saved);
      setError('');
      setMessage(`已保存 ${tasks.length} 条任务（${periodStart} 至 ${periodEnd}）`);
      return true;
    } catch (e) {
      setError(e.message || '保存失败：浏览器本地存储空间不足或不可用。');
      setMessage('');
      return false;
    }
  }, [tasks, periodStart, periodEnd, taskProjects, coveredSourceKeys, deletedSources, projectScope, onSaved, workspace?.saveTasks]);

  const handleDeleteTask = useCallback((task) => {
    const hasSibling = tasks.some(item => item.id !== task.id && item.sourceKey === task.sourceKey);
    draft.change('删除 Task',d=>{
      d.tasks=d.tasks.filter(item=>item.id!==task.id);
      const withoutSource=d.deletedSources.filter(item=>item.sourceKey!==task.sourceKey);
      const sourceDate=normalizeTaskListDate(task.sourceDate||task.dueDate);
      d.deletedSources=!hasSibling&&task.sourceKey&&sourceDate?[...withoutSource,{sourceKey:task.sourceKey,sourceDate}]:withoutSource;
    });
    setError('');
    setMessage('');
  }, [tasks]);

  const handleSaveAndExport = useCallback(() => {
    if (!persistCurrent()) return;
    try {
      exportTaskListWorkbook(tasks, periodStart, periodEnd);
      setMessage(`已保存并导出 ${tasks.length} 条任务`);
    } catch (e) {
      setError('任务已保存，但 Excel 导出失败：' + e.message);
    }
  }, [persistCurrent, tasks, periodStart, periodEnd]);

  if (step === 'period') {
    return (
      <div className="modal-overlay tasklist-overlay" onClick={onClose}>
        <div className="modal glass-card tasklist-period-modal" onClick={e => e.stopPropagation()}>
          <h3>生成并导出 Task List</h3>
          <p className="tasklist-modal-subtitle">{projectScope?'本项目：'+projectScope.name+' · '+projectScope.code:'全部项目'} · 选择日期后，遇到已保存的重叠期间会询问是否复用。</p>
          <div className="export-form">
            <div className="form-group">
              <label>期间开始日</label>
              <input aria-label="Task 期间开始日" type="date" value={periodStart} onChange={e => {setPeriodStart(e.target.value);setError('');}} />
            </div>
            <div className="form-group">
              <label>期间结束日</label>
              <input aria-label="Task 期间结束日" type="date" value={periodEnd} min={periodStart} onChange={e => {setPeriodEnd(e.target.value);setError('');}} />
            </div>
            <div style={{padding:'12px 14px',background:"var(--surface-tint)",borderRadius:'8px',fontSize:'12px',color:"var(--text)",lineHeight:1.65}}>
              系统将按“每个项目的每个节点 = 一条 Task”预生成清单；现场开始、现场结束和项目组现场仅作为时间标记，不生成 Task。进入下一步后可填写开始日、从当前经理全部项目的已排班人员中选择一人或多人，并可编辑、拆分、删除或手动新增任务。
            </div>
            {error && <div className="tasklist-footer-error">{error}</div>}
          </div>
          <div className="modal-actions">
            <button className="glass-btn" onClick={onClose}>取消</button>
            <button className="glass-btn primary-btn" onClick={handlePrepare}>生成预览</button>
          </div>
        </div>
      </div>
    );
  }

  if (step === 'conflict') {
    return (
      <div className="modal-overlay tasklist-overlay" onClick={onClose}>
        <div className="modal glass-card tasklist-period-modal" onClick={e => e.stopPropagation()}>
          <h3>发现已保存的重叠期间</h3>
          <p className="tasklist-modal-subtitle">{projectScope?'本项目：'+projectScope.name+' · '+projectScope.code:'全部项目'} · {periodStart} 至 {periodEnd}</p>
          <p style={{fontSize:'13px',color:"var(--text)",lineHeight:1.6}}>请选择如何处理重叠期间。复用会保留上次编辑的字段、手动新增 Task、删除结果和拆分分组；未重叠期间及后来新增的节点仍由系统生成。</p>
          <div className="tasklist-conflict-list">
            {overlaps.map(item => {
              const overlapStart = item.periodStart > periodStart ? item.periodStart : periodStart;
              const overlapEnd = item.periodEnd < periodEnd ? item.periodEnd : periodEnd;
              let savedTime = projectScope?overviewTaskSnapshotTime(item,projectScope):item.updatedAt || item.savedAt || '';
              try { savedTime = savedTime ? new Date(savedTime).toLocaleString('zh-CN', {hour12:false}) : '未知'; } catch (e) {}
              return <div className="tasklist-conflict-item" key={item.id}>
                <strong>{item.periodStart} 至 {item.periodEnd}</strong><br/>
                重叠：{overlapStart} 至 {overlapEnd} · {item.tasks.length} 条 · 上次保存：{savedTime}
              </div>;
            })}
          </div>
          <div style={{fontSize:'11px',color:"var(--muted)",lineHeight:1.5}}>如有多个存档覆盖同一节点，复用时以最近保存的版本为准。</div>
          {error && <div className="tasklist-footer-error" style={{marginTop:'10px'}}>{error}</div>}
          <div className="modal-actions" style={{flexWrap:'wrap'}}>
            <button className="glass-btn" onClick={() => {setStep('period');setError('');}}>返回修改期间</button>
            <button className="glass-btn" onClick={() => openEditor(baseRows, baseRows.map(task => task.sourceKey), [])}>重新生成重叠部分</button>
            <button className="glass-btn primary-btn" onClick={() => {
              const reused = reuseSavedTaskRows(baseRows, overlaps, periodStart, periodEnd);
              openEditor(reused.rows, reused.coveredSourceKeys, reused.deletedSources);
            }}>复用已保存任务</button>
          </div>
        </div>
      </div>
    );
  }

  const problems = validateTaskListRows(tasks, periodStart, periodEnd, taskProjects);
  const uniqueSources = new Set(tasks.map(task => task.sourceKey)).size;
  const splitExtra = Math.max(0, tasks.length - uniqueSources);
  const systemSources = new Set(tasks.filter(task => !task.isManual).map(task => task.sourceKey)).size;
  const manualTasks = tasks.filter(task => task.isManual).length;
  const splitGroupIds = Array.from(new Set(tasks.map(task => task.splitGroupId).filter(Boolean)));
  const splitGroupIndex = new Map(splitGroupIds.map((id, index) => [id, index]));
  const activeAssigneeTask = tasks.find(task => task.id === assigneeTaskId);
  const activeSplitTask = tasks.find(task => task.id === splitTaskId);

  return (
    <div className="modal-overlay tasklist-overlay">
      <div className="modal glass-card tasklist-modal" onClick={e => e.stopPropagation()} onBlurCapture={draft.closeGroup}>
        <div className="tasklist-modal-header">
          <div>
            <h3>{projectScope?'本项目 Task 编辑':'Task List 编辑确认'}</h3>
            <div className="tasklist-modal-subtitle">{projectScope?projectScope.name+' · '+projectScope.code+' · ':'全部项目 · '}期间：{periodStart} 至 {periodEnd} · 编辑为草稿，点击保存后写入全局历史 · 系统行截止日来自节点 DDL</div>
          </div>
          <div className="tasklist-summary">
            <span className="tasklist-summary-badge">{systemSources} 个系统节点</span>
            {manualTasks > 0 && <span className="tasklist-summary-badge">{manualTasks} 条手动 Task</span>}
            <span className="tasklist-summary-badge">{tasks.length} 条 Task</span>
            {splitExtra > 0 && <span className="tasklist-summary-badge">已拆分 +{splitExtra}</span>}
            {problems.length > 0 && <span className="tasklist-summary-badge warn">待补充 {problems.length} 项</span>}
          </div>
        </div>
        <div className="tasklist-toolbar">
          <div className="task-draft-controls"><button className="glass-btn" disabled={!draft.past.length} onClick={()=>{draft.undo();setMessage('草稿已撤销；需要保留时请保存。');}} title={draft.past[draft.past.length-1]?.label}>↶ 撤销编辑</button><button className="glass-btn" disabled={!draft.future.length} onClick={()=>{draft.redo();setMessage('草稿已重做；需要保留时请保存。');}} title={draft.future[draft.future.length-1]?.label}>↷ 重做编辑</button></div>
          <div className="form-group">
            <label>批量开始日</label>
            <input aria-label="批量开始日" type="date" value={bulkStartDate} onChange={e => setBulkStartDate(e.target.value)} />
          </div>
          <span aria-live="polite">已选 {selectedCount} / {tasks.length} 条</span>
          <button className="glass-btn" disabled={!selectedCount} onClick={()=>setSelectedTaskIds(new Set())}>取消选择</button>
          <button className="glass-btn" disabled={!selectedCount || !bulkStartDate} onClick={applyBulkStart}>修改所选开始日</button>
          <button className="glass-btn" disabled={!selectedCount} onClick={()=>setBulkAssigneeIds(selectedTasks.map(task=>task.id))}>分配所选人员</button>
          <button className="glass-btn danger-btn" disabled={!selectedCount} onClick={deleteSelectedTasks}>删除所选任务</button>
          <button className="glass-btn" style={{padding:'7px 12px',fontSize:'12px'}} onClick={() => {
            const row = createManualTaskListRow();
            if(projectScope)Object.assign(row,{...taskListProjectFields(projectScope),sourceKey:overviewTaskSourcePrefix(projectScope)+'manual::'+row.id});
            draft.change('新增 Task',d=>{d.tasks=[row,...d.tasks];d.coveredSourceKeys=Array.from(new Set([...d.coveredSourceKeys,row.sourceKey]));});
            setError('');setMessage('');
            setTimeout(() => {if (taskTableRef.current) taskTableRef.current.scrollTop = 0;}, 0);
          }}>＋ 手动新增 Task</button>
          <div className="tasklist-helper">{projectScope&&'仅编辑、保存与导出本项目任务。'}红色字段为必填或日期顺序有误；分工池包含当前经理全部项目的已排班人员。</div>
        </div>
        {tasks.length === 0 ? <div className="tasklist-empty">所选期间没有系统 Task，可点击“手动新增 Task”创建。</div> : (
          <div className="tasklist-table-wrap" ref={taskTableRef}>
            <table className="tasklist-table">
              <thead><tr>
                <th className="col-task-select"><input type="checkbox" aria-label="全选任务" checked={tasks.length>0&&selectedCount===tasks.length} ref={el=>{if(el)el.indeterminate=selectedCount>0&&selectedCount<tasks.length;}} onChange={e=>setSelectedTaskIds(e.target.checked?new Set(tasks.map(task=>task.id)):new Set())}/></th>
                <th className="col-task-engagement">Engagement Name</th>
                <th className="col-task-date">开始日</th>
                <th className="col-task-date">截止日</th>
                <th className="col-task-assignee">分工对象</th>
                <th className="col-task-description">任务描述</th>
                <th className="col-task-node">节点</th>
                <th className="col-task-output">进度描述</th>
                <th className="col-task-output">是否已完成</th>
                <th className="col-task-action">操作</th>
              </tr></thead>
              <tbody>
                {tasks.map(task => {
                  const dateOrderInvalid = !!task.startDate && !!task.dueDate && task.startDate > task.dueDate;
                  const groupNumber = task.splitGroupId ? splitGroupIndex.get(task.splitGroupId) : -1;
                  const staffOptions = getStaffOptions(task);
                  const linkedProject=resolveTaskListProject(task,taskProjects);
                  return (
                    <tr data-task-project={task.projectCode||''} key={task.id} className={groupNumber >= 0 ? `split-group-${groupNumber % 6}` : ''}>
                      <td className="col-task-select"><input type="checkbox" aria-label={`选择任务：${task.engagementName||'未命名项目'} · ${task.nodeName||'新任务'}`} checked={selectedTaskIds.has(task.id)} onChange={e=>{const checked=e.target.checked;setSelectedTaskIds(prev=>{const next=new Set(prev);checked?next.add(task.id):next.delete(task.id);return next;});}}/></td>
                      <td>{!task.isManual||projectScope
                        ? <div data-task-field="project" className="task-project-locked" role="textbox" aria-label="Engagement Name" aria-readonly="true" title={(task.projectCode?task.projectCode+' · ':'')+(projectScope?'本项目模式下锁定当前项目':'项目来自来源节点，不可更改')}><span>{task.engagementName||task.sourceProjectName||'未命名项目'}</span></div>
                        : <div data-task-field="project" className={'task-project-picker'+(!linkedProject?' missing':'')}><PersonPicker label="Engagement Name" value={linkedProject?taskListProjectValue(linkedProject):''} placeholder={task.engagementName&&!linkedProject?'请重新选择：'+task.engagementName:'搜索项目名称或 Code'} options={projectOptions} itemNoun="项目" itemUnit="个" onChange={value=>{
                          const project=taskProjects.find(p=>taskListProjectValue(p)===value);
                          if(project){draft.change('选择 Task 项目',d=>selectManualTaskProject(d,task.id,project));setError('');setMessage('');}
                        }}/></div>}
                      </td>
                      <td><input data-task-field="start" aria-label="开始日" className={!task.startDate || dateOrderInvalid ? 'invalid-field' : ''} type="date" value={task.startDate || ''} max={task.dueDate || undefined} onChange={e => updateTask(task.id, {startDate:e.target.value})} /></td>
                      <td>{task.isManual
                        ? <input data-task-field="due" aria-label="截止日" className={!task.dueDate || dateOrderInvalid ? 'invalid-field' : ''} type="date" value={task.dueDate || ''} min={periodStart} max={periodEnd} onChange={e => updateTask(task.id, {dueDate:e.target.value,sourceDate:e.target.value})} />
                        : <input data-task-field="due" aria-label="截止日" className={!task.dueDate || dateOrderInvalid ? 'invalid-field' : ''} type="date" value={task.dueDate || ''} disabled title="与节点 DDL 一致" />}
                      </td>
                      <td>
                        <button data-task-field="assignees" className={`task-assignee-btn ${(task.assignees || []).length === 0 ? 'missing' : ''} ${staffOptions.length === 0 ? 'no-options' : ''}`}
                          onClick={() => setAssigneeTaskId(task.id)}>
                          {staffOptions.length === 0 ? '暂无已排班人员' : (task.assignees || []).length > 0 ? task.assignees.join('; ') : '选择一人或多人…'}
                        </button>
                      </td>
                      <td><textarea data-task-field="description" aria-label="任务描述" rows={2} className={!String(task.taskDescription || '').trim() ? 'invalid-field' : ''} value={task.taskDescription || ''} onChange={e => updateTask(task.id, {taskDescription:e.target.value})} /></td>
                      <td><input data-task-field="node" aria-label="节点" className={!String(task.nodeName || '').trim() ? 'invalid-field' : ''} type="text" value={task.nodeName || ''} onChange={e => updateTask(task.id, {nodeName:e.target.value})} /></td>
                      <td><div data-task-field="progress" className="tasklist-output-placeholder">导出后填写</div></td>
                      <td><div data-task-field="completed" className="tasklist-output-placeholder">导出后填写</div></td>
                      <td className="col-task-action">
                        <div className="task-action-content">
                        <div className="task-action-buttons">
                          <button className="glass-btn task-split-btn" onClick={() => setSplitTaskId(task.id)}><UIIcon name="split"/>拆分</button>
                          <button className="glass-btn danger-btn task-delete-btn" onClick={() => {
                            const label = task.taskDescription || task.nodeName || '此 Task';
                            if (confirm(`删除「${label}」？`)) handleDeleteTask(task);
                          }}><UIIcon name="trash"/>删除</button>
                        </div>
                        {groupNumber >= 0 && <span className="task-split-label">拆分组 {groupNumber + 1}</span>}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        <div className="tasklist-footer">
          <div style={{flex:1}}>
            {error && <div className="tasklist-footer-error">{error}</div>}
            {!error && message && <div className="tasklist-footer-message">✓ {message}</div>}
          </div>
          <button className="glass-btn" onClick={onClose}>关闭</button>
          <button className="glass-btn" onClick={persistCurrent}>保存</button>
          <button className="glass-btn primary-btn" onClick={handleSaveAndExport}>保存并导出 Excel</button>
        </div>
      </div>
      {bulkAssigneeIds && <TaskAssigneeModal
        task={{engagementName:`统一分配 ${bulkAssigneeIds.length} 条所选任务`,taskDescription:'确认后替换这些任务原有的全部分工对象；未选任务保持不变。',assignees:[]}}
        options={Array.from(new Set(tasks.filter(task=>bulkAssigneeIds.includes(task.id)).flatMap(getStaffOptions)))}
        onSave={assignees=>{
          const ids=new Set(bulkAssigneeIds);
          draft.change('批量分配 Task 人员',d=>{d.tasks=d.tasks.map(task=>ids.has(task.id)?{...task,assignees:[...assignees]}:task);});
          setError('');setMessage(`已分配 ${bulkAssigneeIds.length} 条所选任务；保存后生效。`);setBulkAssigneeIds(null);
        }} onClose={()=>setBulkAssigneeIds(null)} />}
      {activeAssigneeTask && (
        <TaskAssigneeModal
          key={activeAssigneeTask.id}
          task={activeAssigneeTask}
          options={getStaffOptions(activeAssigneeTask)}
          onSave={assignees => {updateTask(activeAssigneeTask.id, {assignees});setAssigneeTaskId(null);}}
          onClose={() => setAssigneeTaskId(null)}
        />
      )}
      {activeSplitTask && (
        <TaskSplitModal
          key={activeSplitTask.id}
          task={activeSplitTask}
          onSplit={applySplit}
          onClose={() => setSplitTaskId(null)}
        />
      )}
    </div>
  );
}
